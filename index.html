<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Final Fix</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #05070d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            padding: 5px;
        }
        #ui {
            margin-top: 4px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            z-index: 10;
            width: 100%;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; color: #ff007f; }
        .stats-row { margin: 4px 0; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .info-row { margin: 3px 0; font-size: 0.85rem; color: #ff00aa; font-weight: bold; }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            min-height: 0;
        }
        
        canvas {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.25);
            background: #080c16;
            border-radius: 50%;
            width: 70vh;
            height: 70vh;
            max-width: 340px;
            max-height: 340px;
        }

        #controls-bar {
            margin-bottom: 5px;
            display: flex;
            gap: 5px;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background: rgba(0, 255, 204, 0.15);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 8px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.6rem;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
        }

        .btn.active {
            background: #ff007f;
            border-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 10px #ff007f;
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 12, 22, 0.95);
            border: 2px solid #ff007f;
            padding: 20px;
            border-radius: 15px;
            z-index: 200;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
            display: none;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }
        .modal h2 { margin-top: 0; color: #ff007f; font-size: 1.1rem; }
        .setting-group { margin: 10px 0; font-size: 0.75rem; color: #8ab4f8; }
        .setting-group input { width: 90px; background: #05070d; border: 1px solid #00ffcc; color: #00ffcc; text-align: center; font-family: inherit; padding: 4px; border-radius: 5px; }

        #achievementToast {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 127, 0.9);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 0 15px #ff007f;
            z-index: 300;
            transition: top 0.4s ease;
            pointer-events: none;
            text-align: center;
        }
        #achievementToast.show { top: 15px; }

        #floatingExitBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 127, 0.3);
            border: 2px solid #ff007f;
            color: #ff007f;
            padding: 6px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.65rem;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            z-index: 100;
            display: none;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                align-items: center;
                padding: 10px;
            }
            #ui { width: 45%; text-align: left; padding-left: 15px; }
            h1 { font-size: 1.2rem; }
            .canvas-container { width: 50%; height: 100vh; }
            canvas { width: 78dvh; height: 78dvh; max-width: 290px; max-height: 290px; }
            #controls-bar { width: 45%; flex-direction: column; align-items: stretch; gap: 4px; }
            .btn { font-size: 0.7rem; padding: 6px; text-align: center; }
        }
    </style>
</head>
<body>

    <button id="floatingExitBtn" onclick="toggleRelaxMode()">SALIR RELAX</button>
    <div id="achievementToast">🏆 ¡Logro Desbloqueado!</div>

    <div id="settingsModal" class="modal">
        <h2>AJUSTES DE JUEGO</h2>
        <div class="setting-group">
            <label>Aciertos / Nivel:</label><br>
            <input type="number" id="hitsPerLevelInput" value="1" min="1" max="10" onchange="updateSettings()">
        </div>
        <div class="setting-group">
            <label>Errores Penalización:</label><br>
            <input type="number" id="failsPerPenaltyInput" value="3" min="1" max="10" onchange="updateSettings()">
        </div>
        <div class="setting-group">
            <label>Volumen FX:</label><br>
            <input type="range" id="fxVolInput" min="0" max="1" step="0.1" value="0.3" onchange="updateSettings()">
        </div>
        <div class="setting-group">
            <label>Volumen Música:</label><br>
            <input type="range" id="musicVolInput" min="0" max="1" step="0.1" value="0.1" onchange="updateSettings()">
        </div>
        <button class="btn active" style="margin-top:10px;" onclick="toggleModal('settingsModal')">CERRAR</button>
    </div>

    <div id="achievementsModal" class="modal">
        <h2>LOGROS</h2>
        <div id="achievementsList" style="font-size: 0.7rem; text-align: left; max-height: 180px; overflow-y: auto; margin-bottom: 10px;"></div>
        <button class="btn active" onclick="toggleModal('achievementsModal')">CERRAR</button>
    </div>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY</h1>
        <div class="stats-row" id="statsRow">Ptos: <span id="score">0</span> | Récord: <span id="highScore">0</span> | Nivel: <span id="level">1</span></div>
        <div class="info-row">Modo: <span id="modeLabel">Arcade</span> | Paleta: <span id="themeLabel">Cyber</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="controls-bar">
        <button id="pauseBtn" class="btn" onclick="togglePause()">PAUSA</button>
        <button id="modeBtn" class="btn" onclick="toggleGameMode()">MODO: ARCADE</button>
        <button class="btn" onclick="resetGame()">REINICIAR</button>
        <button class="btn" onclick="toggleModal('settingsModal')">AJUSTES</button>
        <button class="btn" onclick="openAchievements()">LOGROS</button>
        <button id="relaxBtn" class="btn" onclick="toggleRelaxMode()">RELAX</button>
        <button id="themeBtn" class="btn" onclick="changeTheme()">PALETA: 1/20</button>
        <button id="speedBtn" class="btn" onclick="changeSpeed()">VEL: 1.0x</button>
        <button id="autoBtn" class="btn" onclick="toggleAutoMode()">AUTO: OFF</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statsRow = document.getElementById('statsRow');
    const modeLabel = document.getElementById('modeLabel');
    const themeLabel = document.getElementById('themeLabel');
    const mainTitle = document.getElementById('mainTitle');
    const autoBtn = document.getElementById('autoBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const relaxBtn = document.getElementById('relaxBtn');
    const themeBtn = document.getElementById('themeBtn');
    const modeBtn = document.getElementById('modeBtn');
    const uiContainer = document.getElementById('ui');
    const controlsBar = document.getElementById('controls-bar');
    const floatingExitBtn = document.getElementById('floatingExitBtn');
    const achievementToast = document.getElementById('achievementToast');

    let score = 0;
    let highScore = localStorage.getItem('polarHighScore') || 0;
    document.getElementById('highScore').innerText = highScore;

    let level = 1;
    let successfulHits = 0;
    let consecutiveFails = 0;
    
    let requiredHitsForLevel = 1;
    let maxFailsForPenalty = 3;
    let fxVolume = 0.3;
    let musicVolume = 0.1;

    let autoMode = false;
    let isPaused = false;
    let relaxMode = false;
    let gameMode = 'arcade';
    let timeAttackSeconds = 60;
    let timeAttackTimer = null;
    let gameSpeed = 1.0;
    let angle = 0;
    
    let curveType = 'rose';
    let p1 = 4, p2 = 5, p3 = 1;
    let currentScale = 90;
    let relaxTimer = 0;
    let screenShake = 0;

    let achievements = [
        { id: 'first_perfect', name: 'Primer Impacto', desc: 'Consigue tu primer acierto perfecto', unlocked: false },
        { id: 'level_10', name: 'Explorador Polar', desc: 'Alcanza el nivel 10', unlocked: false },
        { id: 'score_1000', name: 'Fiebre Neón', desc: 'Supera los 1000 puntos en Arcade', unlocked: false },
        { id: 'speed_demon', name: 'Velocidad Luz', desc: 'Juega a velocidad 3.0x', unlocked: false }
    ];

    const themes = [
        { name: 'Cyber', bg: '#080c16', stroke: '#ff007f', target: '#00ffcc', wave: 'rgba(0, 255, 204, 0.85)', glow: 'rgba(255, 0, 127, 0.3)' },
        { name: 'Matrix', bg: '#020f04', stroke: '#00ff55', target: '#adff2f', wave: 'rgba(173, 255, 47, 0.85)', glow: 'rgba(0, 255, 85, 0.3)' },
        { name: 'Laser', bg: '#0e0214', stroke: '#bf00ff', target: '#00ffff', wave: 'rgba(0, 255, 255, 0.85)', glow: 'rgba(191, 0, 255, 0.3)' },
        { name: 'Retro 8b', bg: '#021008', stroke: '#33ff33', target: '#ffff33', wave: 'rgba(255, 255, 51, 0.85)', glow: 'rgba(51, 255, 51, 0.3)' },
        { name: 'Sunset', bg: '#14050a', stroke: '#ff3366', target: '#ffcc00', wave: 'rgba(255, 204, 0, 0.85)', glow: 'rgba(255, 51, 102, 0.3)' },
        { name: 'Acid', bg: '#0f1402', stroke: '#ccff00', target: '#ff00ff', wave: 'rgba(255, 0, 255, 0.85)', glow: 'rgba(204, 255, 0, 0.3)' },
        { name: 'Gold', bg: '#120c02', stroke: '#ffaa00', target: '#ffffff', wave: 'rgba(255, 255, 255, 0.85)', glow: 'rgba(255, 170, 0, 0.3)' },
        { name: 'Frost', bg: '#020a14', stroke: '#00ccff', target: '#ffffff', wave: 'rgba(0, 204, 255, 0.85)', glow: 'rgba(0, 204, 255, 0.3)' },
        { name: 'Blood', bg: '#140202', stroke: '#ff0000', target: '#ff9999', wave: 'rgba(255, 153, 153, 0.85)', glow: 'rgba(255, 0, 0, 0.3)' },
        { name: 'Neon Vio', bg: '#0a0214', stroke: '#9900ff', target: '#00ffaa', wave: 'rgba(0, 255, 170, 0.85)', glow: 'rgba(153, 0, 255, 0.3)' },
        { name: 'Solar', bg: '#140a02', stroke: '#ff6600', target: '#ffff00', wave: 'rgba(255, 255, 0, 0.85)', glow: 'rgba(255, 102, 0, 0.3)' },
        { name: 'Emerald', bg: '#02140d', stroke: '#00ffaa', target: '#00ffff', wave: 'rgba(0, 255, 170, 0.85)', glow: 'rgba(0, 255, 170, 0.3)' },
        { name: 'Orchid', bg: '#120214', stroke: '#ff00cc', target: '#cc99ff', wave: 'rgba(204, 153, 255, 0.85)', glow: 'rgba(255, 0, 204, 0.3)' },
        { name: 'Plasma', bg: '#0f0214', stroke: '#ff0066', target: '#00ffcc', wave: 'rgba(0, 255, 204, 0.85)', glow: 'rgba(255, 0, 102, 0.3)' },
        { name: 'Deep Space', bg: '#010208', stroke: '#3388ff', target: '#ff33bb', wave: 'rgba(255, 51, 187, 0.85)', glow: 'rgba(51, 136, 255, 0.3)' },
        { name: 'Cyberpunk', bg: '#120114', stroke: '#ff00ff', target: '#00ffff', wave: 'rgba(0, 255, 255, 0.85)', glow: 'rgba(255, 0, 255, 0.3)' },
        { name: 'Toxic', bg: '#051202', stroke: '#33ff00', target: '#ff0066', wave: 'rgba(255, 0, 102, 0.85)', glow: 'rgba(51, 255, 0, 0.3)' },
        { name: 'Magma', bg: '#140602', stroke: '#ff3300', target: '#ffcc00', wave: 'rgba(255, 204, 0, 0.85)', glow: 'rgba(255, 51, 0, 0.3)' },
        { name: 'Arctic', bg: '#020f14', stroke: '#00ffcc', target: '#0055ff', wave: 'rgba(0, 85, 255, 0.85)', glow: 'rgba(0, 204, 255, 0.3)' },
        { name: 'Amethyst', bg: '#0a0212', stroke: '#9933ff', target: '#ff99ff', wave: 'rgba(255, 153, 255, 0.85)', glow: 'rgba(153, 51, 255, 0.3)' }
    ];
    let currentThemeIndex = 0;
    let theme = themes[0];

    let pulseRadius = 0;
    let feedbackTimer = 0;
    let feedbackText = '';
    let feedbackColor = '#00ffcc';
    let screenFlash = 0;
    let particles = [];
    let targetParticles = [];
        let target = {
        angle: Math.random() * Math.PI * 2,
        radius: 110,
        speed: 0.005
    };

    function unlockAchievement(id) {
        let ach = achievements.find(a => a.id === id);
        if (ach && !ach.unlocked) {
            ach.unlocked = true;
            achievementToast.innerText = `🏆 ¡Logro: ${ach.name}!`;
            achievementToast.classList.add('show');
            setTimeout(() => achievementToast.classList.remove('show'), 3500);
        }
    }

    function openAchievements() {
        let listEl = document.getElementById('achievementsList');
        listEl.innerHTML = '';
        achievements.forEach(a => {
            listEl.innerHTML += `<div style="margin:6px 0; color:${a.unlocked ? '#00ffcc' : '#666'}"><b>${a.name}</b> (${a.unlocked ? '✔' : '🔒'})<br><span style="font-size:0.6rem; color:#aaa;">${a.desc}</span></div>`;
        });
        toggleModal('achievementsModal');
    }

    function toggleModal(id) {
        let m = document.getElementById(id);
        m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    function resetTarget() {
        target.angle = Math.random() * Math.PI * 2;
        target.radius = 45 + Math.random() * (currentScale - 20);
        target.speed = (Math.random() > 0.5 ? 1 : -1) * (0.003 + (level * 0.0007));
        pulseRadius = 0;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
            startProceduralMusic();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSynthTone(freq, type = 'sine', duration = 0.3) {
        try {
            if (!audioCtx || isPaused || relaxMode) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(fxVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    const backgroundScale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63];
    function startProceduralMusic() {
        if (musicInterval) return;
        musicInterval = setInterval(() => {
            if (!audioCtx || audioCtx.state !== 'running' || isPaused) return;
            let modFreq = backgroundScale[Math.floor(Math.random() * backgroundScale.length)] * (1 + Math.sin(target.angle) * 0.1);
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(modFreq, audioCtx.currentTime);
                gain.gain.setValueAtTime(musicVolume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.2);
            } catch(e) {}
        }, 3500);
    }

    function generateNewForm() {
        const types = ['roseFrac', 'piWave', 'harmonic', 'cardioidLim', 'lemniscate', 'epicycloid'];
        curveType = types[Math.floor(Math.random() * types.length)];
        p1 = Math.floor(Math.random() * 6) + 1;
        p2 = Math.floor(Math.random() * 4) + 2;
        p3 = Math.floor(Math.random() * 2) + 1;
        currentScale = Math.floor(Math.random() * 90) + 60;
    }

    function calculatePolarRadius(th, currentAngle) {
        let t = th + currentAngle;
        switch(curveType) {
            case 'roseFrac': return currentScale * Math.sin((p1 * t) / p2);
            case 'piWave': return currentScale * Math.sin(p1 * Math.PI * t / p2);
            case 'harmonic': return currentScale * (Math.sin(p1 * t) + Math.cos(p2 * th) / p3);
            case 'cardioidLim': return currentScale * (1 + 0.5 * Math.cos(p1 * t));
            case 'lemniscate': return currentScale * Math.sqrt(Math.abs(Math.cos(p1 * t)));
            case 'epicycloid': return currentScale * (Math.sin(p1 * t) * Math.cos(p2 * th));
            default: return currentScale * Math.sin(p1 * t);
        }
    }

    function createExplosionParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            let pAngle = Math.random() * Math.PI * 2;
            let pSpeed = Math.random() * 3 + 1;
            particles.push({ x: x, y: y, vx: Math.cos(pAngle) * pSpeed, vy: Math.sin(pAngle) * pSpeed, life: 1.0, color: theme.target });
        }
    }

    function toggleAutoMode() {
        initAudio();
        autoMode = !autoMode;
        autoBtn.classList.toggle('active', autoMode);
        autoBtn.innerText = autoMode ? "AUTO: ON" : "AUTO: OFF";
    }

    function togglePause() {
        initAudio();
        isPaused = !isPaused;
        pauseBtn.classList.toggle('active', isPaused);
        pauseBtn.innerText = isPaused ? "REANUDAR" : "PAUSA";
    }

    function updateSettings() {
        requiredHitsForLevel = parseInt(document.getElementById('hitsPerLevelInput').value) || 1;
        maxFailsForPenalty = parseInt(document.getElementById('failsPerPenaltyInput').value) || 3;
        fxVolume = parseFloat(document.getElementById('fxVolInput').value);
        musicVolume = parseFloat(document.getElementById('musicVolInput').value);
    }

    function toggleGameMode() {
        if (gameMode === 'arcade') {
            gameMode = 'infinite';
            modeBtn.innerText = "MODO: INFINITO";
        } else if (gameMode === 'infinite') {
            gameMode = 'timeAttack';
            modeBtn.innerText = "MODO: CONTRARELOJ";
            startTimeAttack();
        } else {
            gameMode = 'arcade';
            modeBtn.innerText = "MODO: ARCADE";
            if (timeAttackTimer) clearInterval(timeAttackTimer);
        }
        modeBtn.classList.add('active');
        consecutiveFails = 0;
        successfulHits = 0;
        updateDOMStats();
    }

    function startTimeAttack() {
        timeAttackSeconds = 60;
        if (timeAttackTimer) clearInterval(timeAttackTimer);
        timeAttackTimer = setInterval(() => {
            if (!isPaused && !relaxMode && gameMode === 'timeAttack') {
                timeAttackSeconds--;
                updateDOMStats();
                if (timeAttackSeconds <= 0) {
                    clearInterval(timeAttackTimer);
                    alert("¡Tiempo agotado! Puntuación final: " + score);
                    resetGame();
                }
            }
        }, 1000);
    }

    function updateDOMStats() {
        if (gameMode === 'infinite') {
            modeLabel.innerText = "Infinito";
            statsRow.innerHTML = `Nivel: <span id="level">${level}</span>`;
        } else if (gameMode === 'timeAttack') {
            modeLabel.innerText = "Contrarreloj";
            statsRow.innerHTML = `Tiempo: ${timeAttackSeconds}s | Ptos: ${score} | Nivel: <span id="level">${level}</span>`;
        } else {
            modeLabel.innerText = "Arcade";
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Nivel: <span id="level">${level}</span>`;
        }
    }

    function resetGame() {
        score = 0;
        level = 1;
        consecutiveFails = 0;
        successfulHits = 0;
        pulseRadius = 0;
        if (gameMode === 'timeAttack') startTimeAttack();
        generateNewForm();
        resetTarget();
        updateDOMStats();
    }

    function toggleRelaxMode() {
        initAudio();
        relaxMode = !relaxMode;
        relaxBtn.classList.toggle('active', relaxMode);
        if (relaxMode) {
            uiContainer.style.opacity = '0';
            uiContainer.style.pointerEvents = 'none';
            controlsBar.style.opacity = '0';
            controlsBar.style.pointerEvents = 'none';
            floatingExitBtn.style.display = 'block';
        } else {
            uiContainer.style.opacity = '1';
            uiContainer.style.pointerEvents = 'auto';
            controlsBar.style.opacity = '1';
            controlsBar.style.pointerEvents = 'auto';
            floatingExitBtn.style.display = 'none';
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        if (!autoMode && !isPaused && !relaxMode) checkAction();
    }, false);

    function changeTheme() {
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        theme = themes[currentThemeIndex];
        themeLabel.innerText = theme.name;
        themeBtn.innerText = `PALETA: ${currentThemeIndex + 1}/20`;
        mainTitle.style.color = theme.stroke;
        canvas.style.boxShadow = `0 0 30px ${theme.glow}`;
    }

    function changeSpeed() {
        if (gameSpeed === 1.0) gameSpeed = 1.5;
        else if (gameSpeed === 1.5) gameSpeed = 2.0;
        else if (gameSpeed === 2.0) { gameSpeed = 3.0; unlockAchievement('speed_demon'); }
        else if (gameSpeed === 3.0) gameSpeed = 0.25;
        else if (gameSpeed === 0.25) gameSpeed = 0.5;
        else gameSpeed = 1.0;

        speedBtn.innerText = 'VEL: ' + gameSpeed.toFixed(2).replace(/\.?0+$/, '') + 'x';
    }

    function checkAction() {
        if (isPaused || relaxMode) return;
        initAudio();
        playSynthTone(440, 'triangle', 0.2);

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);

        let diff = Math.abs(pulseRadius - target.radius);
        let tolerance = 25;

        if (diff < tolerance) {
            consecutiveFails = 0;
            successfulHits++;
            unlockAchievement('first_perfect');

            if (gameMode !== 'infinite') {
                score += 100 + (level * (gameMode === 'timeAttack' ? 25 : 10));
                if (gameMode === 'timeAttack') timeAttackSeconds += 3;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('polarHighScore', highScore);
                    if (highScore >= 1000) unlockAchievement('score_1000');
                }
            }

            feedbackText = "¡PERFECTO!";
            feedbackColor = theme.stroke;
            screenFlash = 0.4;
            createExplosionParticles(tx, ty);

            if (successfulHits >= requiredHitsForLevel) {
                level++;
                successfulHits = 0;
                if (level >= 10) unlockAchievement('level_10');
            }

            generateNewForm();
            resetTarget();
        } else {
            consecutiveFails++;
            screenShake = 10;

            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                successfulHits = 0;
                if (gameMode === 'infinite') {
                    level = Math.max(1, level - 1);
                    feedbackText = "¡BAJAS NIVEL!";
                } else {
                    score = 0;
                    feedbackText = "¡PUNTOS A CERO!";
                }
            } else {
                if (gameMode !== 'infinite') score = Math.max(0, score - 15);
                feedbackText = "¡FALLO!";
            }

            feedbackColor = "#ff0055";
        }
        
        updateDOMStats();
        feedbackTimer = 25;
    }

    function update() {
        if (isPaused) return;
        if (screenShake > 0) screenShake *= 0.85;

        if (relaxMode) {
            relaxTimer++;
            if (relaxTimer > 250) {
                relaxTimer = 0;
                generateNewForm();
                changeTheme();
            }
        }

        target.angle += target.speed * gameSpeed;

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        targetParticles.push({ x: tx, y: ty, life: 1.0 });

        for (let i = targetParticles.length - 1; i >= 0; i--) {
            targetParticles[i].life -= 0.1;
            if (targetParticles[i].life <= 0) targetParticles.splice(i, 1);
        }

        pulseRadius += (1.2 + (level * 0.05)) * gameSpeed;

        if (pulseRadius > 220) {
            consecutiveFails++;
            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                if (gameMode === 'infinite') level = Math.max(1, level - 1);
                else score = 0;
                updateDOMStats();
            }
            resetTarget();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.04;
            if (p.life <= 0) particles.splice(i, 1);
        }

        angle += 0.003 * gameSpeed;
        if (autoMode && Math.abs(pulseRadius - target.radius) < 2) checkAction();
    }

    function draw() {
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        ctx.fillStyle = theme.bg;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;

        if (screenFlash > 0) {
            ctx.fillStyle = theme.stroke;
            ctx.globalAlpha = screenFlash;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            screenFlash -= 0.05;
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = theme.stroke;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = theme.stroke;
        ctx.shadowBlur = 10;
        
        let maxTheta = Math.PI * 16;
        for (let th = 0; th < maxTheta; th += 0.01) {
            let r = calculatePolarRadius(th, angle);
            let x = cx + r * Math.cos(th);
            let y = cy + r * Math.sin(th);
            if (th === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        for (let tp of targetParticles) {
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.globalAlpha = tp.life * 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        if (!relaxMode) {
            ctx.beginPath();
            ctx.arc(tx, ty, 8, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.shadowColor = theme.target;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = theme.wave;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (isPaused) {
            ctx.font = 'bold 22px monospace';
            ctx.fillStyle = theme.target;
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (!relaxMode && feedbackTimer > 0) {
            ctx.font = 'bold 18px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy - 40);
            feedbackTimer--;
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    generateNewForm();
    resetTarget();
    loop();
</script>
</body>
</html>
