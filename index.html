            align-items: center;

            justify-content: center;
            width: 100%;

            padding: 5px 8px;

        }

        .modal {
            position: absolute;

            left: 50%;

            border: 2px solid #ff007f;
            padding: 20px;
            border-radius: 15px;
            z-index: 200;

            width: 85%;

            text-align: center;

        .setting-group { margin: 10px 0; font-size: 0.75rem; color: #00ffff; font-weight: bold; }
        .setting-group input { width: 90px; background: #05070d; border: 1px solid #00ffcc; color: #00ffcc; text-align: center; font-family: inherit; padding: 4px; border-radius: 5px; }

        #achievementToast {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);

            color: #fff;

            text-align: center;

</head>

    function resetAchievements() {
        achievements.forEach(a => a.unlocked = false);
        achievementToast.innerText = "¡Logros Reseteados!";

    function unlockAchievement(id) {

    function openAchievements() {

    function toggleModal(id) {

    function resetTarget() {
        target.angle = Math.random() * Math.PI * 2;
        target.radius = 45 + Math.random() * (currentScale - 20);
        target.speed = (Math.random() > 0.5 ? 1 : -1) * (0.003 + (level * 0.0007));
        pulseRadius = 0;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicInterval = null;
    let seqStep = 0;

    // Diferentes escalas musicales para variar entre partidas
    const musicScales = [
        [65.41, 73.42, 77.78, 87.31], // Menor (Original)
        [65.41, 73.42, 82.41, 98.00], // Pentatónica
        [65.41, 69.30, 77.78, 82.41], // Frigia (Oscura)
        [65.41, 77.78, 98.00, 103.83], // Tensión Synth
        [73.42, 82.41, 87.31, 98.00]  // Mayor relativa
    ];
    let currentScaleIndex = 0;
    let currentBase = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
            startProceduralMusic();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleMusic() {
        musicEnabled = !musicEnabled;
        musicBtn.classList.toggle('active', musicEnabled);
        musicBtn.innerText = musicEnabled ? "MÚSICA: ON" : "MÚSICA: OFF";
    }

    function playSynthTone(freq, type = 'sine', duration = 0.3, vol = fxVolume) {
        try {
            if (!audioCtx || isPaused || relaxMode) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    function startProceduralMusic() {
        if (musicInterval) clearInterval(musicInterval);
        musicInterval = setInterval(() => {
            if (!audioCtx || audioCtx.state !== 'running' || isPaused || relaxMode || !musicEnabled) return;

            let activeScale = musicScales[currentScaleIndex];
            if (seqStep % 32 === 0) currentBase = (currentBase + 1) % activeScale.length;
            let baseFreq = activeScale[currentBase] * (1 + (level % 3) * 0.25);

            playSynthTone(baseFreq, 'sawtooth', 0.15, musicVolume * 0.9);
            if (seqStep % 2 !== 0) playSynthTone(baseFreq * 2, 'sawtooth', 0.1, musicVolume * 0.6);

            let arpOffset = Math.floor(Math.abs(Math.cos(target.angle + seqStep)) * 5) * 2;
            let arpFreq = baseFreq * 4 * Math.pow(1.05946, arpOffset * 2);
            playSynthTone(arpFreq, 'square', 0.1, musicVolume * 0.4);

            if (seqStep % 16 === 0) {
                playSynthTone(baseFreq * 2, 'triangle', 2.0, musicVolume * 0.5);
                playSynthTone(baseFreq * 3, 'sine', 2.0, musicVolume * 0.4);
            }
            seqStep++;
        }, 130);
    }

    function generateNewForm() {
        const types = ['roseFrac', 'piWave', 'harmonic', 'cardioidLim', 'lemniscate', 'epicycloid', 'lissajous', 'butterfly', 'spirograph', 'gear', 'star', 'flower'];
        curveType = types[Math.floor(Math.random() * types.length)];
        p1 = Math.floor(Math.random() * 6) + 1;
        p2 = Math.floor(Math.random() * 4) + 2;
        p3 = Math.floor(Math.random() * 3) + 1;
        currentScale = Math.floor(Math.random() * 90) + 60;
    }

    function calculatePolarRadius(th, currentAngle) {
        let t = th + currentAngle;
        switch(curveType) {
            case 'roseFrac': return currentScale * Math.sin((p1 * t) / p2);
            case 'piWave': return currentScale * Math.sin(p1 * Math.PI * t / p2);
            case 'harmonic': return currentScale * (Math.sin(p1 * t) + Math.cos(p2 * th) / p3);
            case 'cardioidLim': return currentScale * (1 + 0.5 * Math.cos(p1 * t));
            case 'lemniscate': return currentScale * Math.sqrt(Math.abs(Math.cos(p1 * t)));
            case 'epicycloid': return currentScale * (Math.sin(p1 * t) * Math.cos(p2 * th));
            case 'lissajous': return currentScale * Math.sin(p1 * t + Math.PI/p3) * Math.cos(p2 * t);
            case 'butterfly': return currentScale * (Math.exp(Math.cos(t)) - 2 * Math.cos(4*t)) * 0.3;
            case 'spirograph': return currentScale * (0.8 * Math.cos(p1 * t) + 0.2 * Math.cos(p2 * t));
            case 'gear': return currentScale * (1 + 0.15 * Math.sin(p1 * p2 * t));
            case 'star': return currentScale * (1 - 0.3 * Math.abs(Math.sin(p1 * t / 2)));
            case 'flower': return currentScale * (0.5 + 0.5 * Math.cos(p1 * t));
            default: return currentScale * Math.sin(p1 * t);
        }
    }

    function createExplosionParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            let pAngle = Math.random() * Math.PI * 2;
            let pSpeed = Math.random() * 3 + 1;
            particles.push({ x: x, y: y, vx: Math.cos(pAngle) * pSpeed, vy: Math.sin(pAngle) * pSpeed, life: 1.0, color: theme.target });
        }
    }

    function toggleAutoMode() {
        initAudio();
        autoMode = !autoMode;
        autoBtn.classList.toggle('active', autoMode);
        autoBtn.innerText = autoMode ? "AUTO: ON" : "AUTO: OFF";
        if (autoMode) unlockAchievement('auto_pilot');
    }

    function togglePause() {
        initAudio();
        isPaused = !isPaused;
        pauseBtn.classList.toggle('active', isPaused);
        pauseBtn.innerText = isPaused ? "REANUDAR" : "PAUSA";
    }

    function updateSettings() {
        requiredHitsForLevel = parseInt(document.getElementById('hitsPerLevelInput').value) || 1;
        maxFailsForPenalty = parseInt(document.getElementById('failsPerPenaltyInput').value) || 3;
        fxVolume = parseFloat(document.getElementById('fxVolInput').value);
        musicVolume = parseFloat(document.getElementById('musicVolInput').value);
    }

    function toggleGameMode() {
        if (gameMode === 'arcade') {
            gameMode = 'infinite';
            modeBtn.innerText = "MODO: INFINITO";
        } else if (gameMode === 'infinite') {
            gameMode = 'timeAttack';
            modeBtn.innerText = "MODO: CONTRARELOJ";
            startTimeAttack();
        } else if (gameMode === 'timeAttack') {
            gameMode = 'ghost';
            modeBtn.innerText = "MODO: FANTASMA";
            if (timeAttackTimer) clearInterval(timeAttackTimer);
        } else {
            gameMode = 'arcade';
            modeBtn.innerText = "MODO: ARCADE";
        }
        modeBtn.classList.add('active');
        consecutiveFails = 0;
        successfulHits = 0;
        perfectStreak = 0;
        updateDOMStats();
    }

    function startTimeAttack() {
        timeAttackSeconds = 60;
        if (timeAttackTimer) clearInterval(timeAttackTimer);
        timeAttackTimer = setInterval(() => {
            if (!isPaused && !relaxMode && gameMode === 'timeAttack') {
                timeAttackSeconds--;
                updateDOMStats();
                if (timeAttackSeconds <= 0) {
                    clearInterval(timeAttackTimer);
                    alert("¡Tiempo agotado! Puntuación final: " + score);
                    resetGame();
                }
            }
        }, 1000);
    }

    function updateDOMStats() {
        if (gameMode === 'infinite') {
            modeLabel.innerText = "Infinito";
            statsRow.innerHTML = `Nivel: <span id="level">${level}</span> | Racha: ${perfectStreak}`;
        } else if (gameMode === 'timeAttack') {
            modeLabel.innerText = "Contrarreloj";
            statsRow.innerHTML = `T: ${timeAttackSeconds}s | Ptos: ${score} | Lvl: <span id="level">${level}</span>`;
        } else if (gameMode === 'ghost') {
            modeLabel.innerText = "Fantasma";
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Lvl: <span id="level">${level}</span>`;
        } else {
            modeLabel.innerText = "Arcade";
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Lvl: <span id="level">${level}</span>`;
        }
    }

    function applyRandomTheme() {
        let rnd = Math.floor(Math.random() * themes.length);
        theme = themes[rnd];
        mainTitle.style.color = theme.stroke;
        canvas.style.boxShadow = `0 0 30px ${theme.glow}`;
    }

    function changeTheme() {
        currentThemeIndex++;
        
        if (currentThemeIndex === themes.length) {
            isRandomThemeMode = true;
            themeLabel.innerText = "Aleatorio";
            themeBtn.innerText = "PALETA: RANDOM";
            applyRandomTheme();
        } else {
            if (currentThemeIndex > themes.length) currentThemeIndex = 0;
            
            isRandomThemeMode = false;
            theme = themes[currentThemeIndex];
            themeLabel.innerText = theme.name;
            themeBtn.innerText = `PALETA: ${currentThemeIndex + 1}/40`;
            mainTitle.style.color = theme.stroke;
            canvas.style.boxShadow = `0 0 30px ${theme.glow}`;
        }
        themesExplored++;
        if (themesExplored >= 10) unlockAchievement('palette_master');
    }
        function changeSpeed() {
        if (gameSpeed === 1.0) gameSpeed = 1.5;
        else if (gameSpeed === 1.5) gameSpeed = 2.0;
        else if (gameSpeed === 2.0) { gameSpeed = 3.0; unlockAchievement('speed_demon'); }
        else if (gameSpeed === 3.0) gameSpeed = 0.25;
        else if (gameSpeed === 0.25) gameSpeed = 0.5;
        else gameSpeed = 1.0;
        speedBtn.innerText = 'VEL: ' + gameSpeed.toFixed(2).replace(/\.?0+$/, '') + 'x';
    }

    function resetGame() {
        score = 0;
        level = 1;
        consecutiveFails = 0;
        successfulHits = 0;
        perfectStreak = 0;
        pulseRadius = 0;
        floatingTexts = [];
        
        // Cambia la escala musical aleatoriamente cada vez que se reinicia la partida
        currentScaleIndex = Math.floor(Math.random() * musicScales.length);

        if (gameMode === 'timeAttack') startTimeAttack();
        generateNewForm();
        resetTarget();
        updateDOMStats();
    }

    function toggleRelaxMode() {
        initAudio();
        relaxMode = !relaxMode;
        relaxBtn.classList.toggle('active', relaxMode);
        if (relaxMode) {
            unlockAchievement('zen_mode');
            uiContainer.style.opacity = '0';
            uiContainer.style.pointerEvents = 'none';
            controlsBar.style.opacity = '0';
            controlsBar.style.pointerEvents = 'none';
            floatingExitBtn.style.display = 'block';
        } else {
            uiContainer.style.opacity = '1';
            uiContainer.style.pointerEvents = 'auto';
            controlsBar.style.opacity = '1';
            controlsBar.style.pointerEvents = 'auto';
            floatingExitBtn.style.display = 'none';
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        if (!autoMode && !isPaused && !relaxMode) checkAction();
    }, false);

    function checkAction() {
        if (isPaused || relaxMode) return;
        initAudio();
        
        // El tono de acierto sí suena siempre como feedback para el jugador
        if(audioCtx && audioCtx.state === 'running') {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);

        let diff = Math.abs(pulseRadius - target.radius);
        let tolerance = 25;

        if (diff < tolerance) {
            consecutiveFails = 0;
            successfulHits++;
            perfectStreak++;
            
            unlockAchievement('first_perfect');
            if (perfectStreak >= 3) unlockAchievement('streak_3');
            if (perfectStreak >= 7) unlockAchievement('streak_7');
            if (perfectStreak >= 15) unlockAchievement('streak_15');

            if (perfectStreak > 1) {
                floatingTexts.push({ x: cx, y: cy - 30, text: `COMBO x${perfectStreak}!`, life: 1.0, color: theme.stroke });
            }

            if (gameMode !== 'infinite') {
                let ghostBonus = (gameMode === 'ghost') ? 50 : 0;
                score += 100 + ghostBonus + (level * (gameMode === 'timeAttack' ? 25 : 10)) + (perfectStreak * 10);
                if (gameMode === 'timeAttack') timeAttackSeconds += 3;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('polarHighScoreGhost', highScore);
                    if (highScore >= 1000) unlockAchievement('score_1000');
                    if (highScore >= 5000) unlockAchievement('score_5000');
                    if (highScore >= 10000) unlockAchievement('score_10000');
                }
            }

            feedbackText = "¡PERFECTO!";
            feedbackColor = theme.stroke;
            screenFlash = 0.4;
            createExplosionParticles(tx, ty);

            if (successfulHits >= requiredHitsForLevel) {
                level++;
                successfulHits = 0;
                if (isRandomThemeMode) applyRandomTheme(); // Cambio automático al subir nivel
                if (level >= 10) unlockAchievement('level_10');
                if (level >= 25) unlockAchievement('level_25');
                if (level >= 50) unlockAchievement('level_50');
            }

            generateNewForm();
            resetTarget();
        } else {
            consecutiveFails++;
            perfectStreak = 0;
            screenShake = 10;

            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                successfulHits = 0;
                if (gameMode === 'infinite' || gameMode === 'arcade' || gameMode === 'ghost') {
                    if (level > 1) unlockAchievement('survivor');
                    level = Math.max(1, level - 1);
                    feedbackText = "¡BAJAS NIVEL!";
                } else {
                    score = 0;
                    feedbackText = "¡PUNTOS A CERO!";
                }
            } else {
                if (gameMode !== 'infinite') score = Math.max(0, score - 15);
                feedbackText = "¡FALLO!";
            }
            feedbackColor = "#ff0055";
        }
        
        updateDOMStats();
        feedbackTimer = 35;
    }

    function update() {
        if (isPaused) return;
        if (screenShake > 0) screenShake *= 0.85;

        if (relaxMode) {
            relaxTimer++;
            if (relaxTimer > 250) {
                relaxTimer = 0;
                generateNewForm();
                if(isRandomThemeMode) applyRandomTheme();
            }
        }

        target.angle += target.speed * gameSpeed;

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        let isGhostInvisible = (gameMode === 'ghost' && pulseRadius > 80);
        
        if (!isGhostInvisible) {
            targetParticles.push({ x: tx, y: ty, life: 1.0 });
        }

        for (let i = targetParticles.length - 1; i >= 0; i--) {
            targetParticles[i].life -= 0.1;
            if (targetParticles[i].life <= 0) targetParticles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].y -= 0.8;
            floatingTexts[i].life -= 0.02;
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }

        pulseRadius += (1.2 + (level * 0.05)) * gameSpeed;

        if (pulseRadius > 220) {
            consecutiveFails++;
            perfectStreak = 0;
            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                if (level > 1) unlockAchievement('survivor');
                if (gameMode === 'infinite') level = Math.max(1, level - 1);
                else score = 0;
                updateDOMStats();
            }
            resetTarget();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.04;
            if (p.life <= 0) particles.splice(i, 1);
        }

        angle += 0.003 * gameSpeed;
        if (autoMode && Math.abs(pulseRadius - target.radius) < 2) checkAction();
    }

    function draw() {
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        ctx.fillStyle = theme.bg;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;

        if (screenFlash > 0) {
            ctx.fillStyle = theme.stroke;
            ctx.globalAlpha = screenFlash;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            screenFlash -= 0.05;
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = theme.stroke;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = theme.stroke;
        ctx.shadowBlur = 10;
        
        let maxTheta = Math.PI * 16;
        for (let th = 0; th < maxTheta; th += 0.01) {
            let r = calculatePolarRadius(th, angle);
            let x = cx + r * Math.cos(th);
            let y = cy + r * Math.sin(th);
            if (th === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        for (let tp of targetParticles) {
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.globalAlpha = tp.life * 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        let isGhostInvisible = (gameMode === 'ghost' && pulseRadius > 80);
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        if (!relaxMode && !isGhostInvisible) {
            ctx.beginPath();
            ctx.arc(tx, ty, 8, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.shadowColor = theme.target;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = theme.wave;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        for (let ft of floatingTexts) {
            ctx.font = 'bold 15px monospace';
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = ft.life;
            ctx.textAlign = 'center';
            ctx.shadowColor = ft.color;
            ctx.shadowBlur = 10;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        if (isPaused) {
            ctx.font = 'bold 22px monospace';
            ctx.fillStyle = theme.target;
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (!relaxMode && feedbackTimer > 0) {
            ctx.font = 'bold 18px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy + 40);
            feedbackTimer--;
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    generateNewForm();
    resetTarget();
    loop();
</script>
</body>
