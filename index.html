<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Final Masterpiece</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #05070d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.5s ease;
            padding: 5px;
        }
        #ui {
            margin-top: 2px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            z-index: 10;
            transition: opacity 0.3s ease;
            width: 100%;
        }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 2px; color: #ff007f; transition: color 0.5s ease; }
        .stats-row { margin: 2px 0; font-size: 0.85rem; color: #ffffff; font-weight: bold; }
        .info-row { margin: 1px 0; font-size: 0.75rem; color: #ff00aa; }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            min-height: 0;
        }
        
        canvas {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.25);
            background: #080c16;
            border-radius: 50%;
            width: 70vh;
            height: 70vh;
            max-width: 340px;
            max-height: 340px;
            transition: box-shadow 0.5s ease;
        }

        #controls-bar {
            margin-bottom: 5px;
            display: flex;
            gap: 5px;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            transition: opacity 0.3s ease;
            width: 100%;
        }

        .btn {
            background: rgba(0, 255, 204, 0.15);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 8px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.6rem;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
        }

        .btn.active {
            background: #ff007f;
            border-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 10px #ff007f;
        }

        #floatingExitBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 127, 0.3);
            border: 2px solid #ff007f;
            color: #ff007f;
            padding: 6px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.65rem;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            z-index: 100;
            display: none;
        }

        #instructions {
            display: none;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                align-items: center;
                padding: 10px;
            }
            #ui {
                width: 45%;
                text-align: left;
                padding-left: 15px;
            }
            h1 { font-size: 1.2rem; }
            .canvas-container {
                width: 50%;
                height: 100vh;
            }
            canvas {
                width: 78dvh;
                height: 78dvh;
                max-width: 290px;
                max-height: 290px;
            }
            #controls-bar {
                width: 45%;
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .btn {
                font-size: 0.7rem;
                padding: 6px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <button id="floatingExitBtn" onclick="toggleRelaxMode()">SALIR RELAX</button>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY</h1>
        <div class="stats-row" id="statsRow">Ptos: <span id="score">0</span> | Récord: <span id="highScore">0</span> | Nivel: <span id="level">1</span></div>
        <div class="info-row">Modo: <span id="modeLabel">Arcade</span> | Paleta: <span id="themeLabel">Cyber</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="controls-bar">
        <button id="pauseBtn" class="btn" onclick="togglePause()">PAUSA</button>
        <button id="modeBtn" class="btn" onclick="toggleGameMode()">MODO: ARCADE</button>
        <button id="relaxBtn" class="btn" onclick="toggleRelaxMode()">RELAX</button>
        <button id="themeBtn" class="btn" onclick="changeTheme()">PALETA: 1/10</button>
        <button id="speedBtn" class="btn" onclick="changeSpeed()">VEL: 1.0x</button>
        <button id="autoBtn" class="btn" onclick="toggleAutoMode()">AUTO: OFF</button>
    </div>
    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const levelEl = document.getElementById('level');
    const statsRow = document.getElementById('statsRow');
    const modeLabel = document.getElementById('modeLabel');
    const themeLabel = document.getElementById('themeLabel');
    const mainTitle = document.getElementById('mainTitle');
    const autoBtn = document.getElementById('autoBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const relaxBtn = document.getElementById('relaxBtn');
    const themeBtn = document.getElementById('themeBtn');
    const modeBtn = document.getElementById('modeBtn');
    const uiContainer = document.getElementById('ui');
    const controlsBar = document.getElementById('controls-bar');
    const floatingExitBtn = document.getElementById('floatingExitBtn');

    let score = 0;
    let highScore = localStorage.getItem('polarHighScore') || 0;
    if (highScoreEl) highScoreEl.innerText = highScore;

    let level = 1;
    let fails = 0;
    let autoMode = false;
    let isPaused = false;
    let relaxMode = false;
    let infiniteMode = false;
    let gameSpeed = 1.0;
    let angle = 0;
    
    let num = 4;
    let den = 5;
    let curveType = 'fraction';
    let currentScale = 90;
    let relaxTimer = 0;

    const themes = [
        { name: 'Cyber', bg: '#080c16', stroke: '#ff007f', target: '#00ffcc', wave: 'rgba(0, 255, 204, 0.7)', glow: 'rgba(255, 0, 127, 0.3)' },
        { name: 'Matrix', bg: '#020f04', stroke: '#00ff55', target: '#adff2f', wave: 'rgba(173, 255, 47, 0.7)', glow: 'rgba(0, 255, 85, 0.3)' },
        { name: 'Laser', bg: '#0e0214', stroke: '#bf00ff', target: '#00ffff', wave: 'rgba(0, 255, 255, 0.7)', glow: 'rgba(191, 0, 255, 0.3)' },
        { name: 'Retro 8b', bg: '#021008', stroke: '#33ff33', target: '#ffff33', wave: 'rgba(255, 255, 51, 0.7)', glow: 'rgba(51, 255, 51, 0.3)' },
        { name: 'Sunset', bg: '#14050a', stroke: '#ff3366', target: '#ffcc00', wave: 'rgba(255, 204, 0, 0.7)', glow: 'rgba(255, 51, 102, 0.3)' },
        { name: 'Acid', bg: '#0f1402', stroke: '#ccff00', target: '#ff00ff', wave: 'rgba(255, 0, 255, 0.7)', glow: 'rgba(204, 255, 0, 0.3)' },
        { name: 'Gold', bg: '#120c02', stroke: '#ffaa00', target: '#ffffff', wave: 'rgba(255, 255, 255, 0.7)', glow: 'rgba(255, 170, 0, 0.3)' },
        { name: 'Frost', bg: '#020a14', stroke: '#00ccff', target: '#ffffff', wave: 'rgba(0, 204, 255, 0.7)', glow: 'rgba(0, 204, 255, 0.3)' },
        { name: 'Blood', bg: '#140202', stroke: '#ff0000', target: '#ff9999', wave: 'rgba(255, 153, 153, 0.7)', glow: 'rgba(255, 0, 0, 0.3)' },
        { name: 'Neon Vio', bg: '#0a0214', stroke: '#9900ff', target: '#00ffaa', wave: 'rgba(0, 255, 170, 0.7)', glow: 'rgba(153, 0, 255, 0.3)' }
    ];
    let currentThemeIndex = 0;
    let theme = themes[0];

    let pulseRadius = 0;
    let feedbackTimer = 0;
    let feedbackText = '';
    let feedbackColor = '#00ffcc';
    let screenFlash = 0;

    let particles = [];

    let target = {
        angle: Math.random() * Math.PI * 2,
        radius: 110,
        speed: 0.005
    };

    function resetTarget() {
        target.angle = Math.random() * Math.PI * 2;
        target.radius = 45 + Math.random() * (currentScale - 20);
        target.speed = (Math.random() > 0.5 ? 1 : -1) * (0.003 + level * 0.0008);
        pulseRadius = 0;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
            startProceduralMusic();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSynthTone(freq, type = 'sine', duration = 0.3) {
        try {
            if (!audioCtx || isPaused || relaxMode) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    const backgroundScale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63];
    function startProceduralMusic() {
        if (musicInterval) return;
        musicInterval = setInterval(() => {
            if (!audioCtx || audioCtx.state !== 'running' || isPaused) return;
            let modFreq = backgroundScale[Math.floor(Math.random() * backgroundScale.length)] * (1 + Math.sin(target.angle) * 0.1);
            playSynthTone(modFreq, 'sine', 2.2);
            setTimeout(() => playSynthTone(modFreq * 1.5, 'triangle', 1.5), 1000);
        }, 3500);
    }

    function getDynamicNote() {
        const baseNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 659.25, 783.99];
        let index = Math.floor(Math.abs(Math.sin(target.angle)) * baseNotes.length);
        return baseNotes[index % baseNotes.length];
    }

    function generateNewForm() {
        const types = ['fraction', 'pi', 'multi', 'rose'];
        curveType = types[Math.floor(Math.random() * types.length)];

        if (curveType === 'fraction') {
            num = Math.floor(Math.random() * 6) + 1;
            den = Math.floor(Math.random() * 5) + 2;
        } else if (curveType === 'pi') {
            num = (Math.random() * 2 + 0.8).toFixed(1);
        } else if (curveType === 'multi') {
            num = Math.floor(Math.random() * 5) + 2;
            den = Math.floor(Math.random() * 3) + 1;
        } else {
            num = Math.floor(Math.random() * 7) + 2;
        }

        currentScale = Math.floor(Math.random() * 110) + 50;
    }

    function createExplosionParticles(x, y) {
        for (let i = 0; i < 16; i++) {
            let pAngle = Math.random() * Math.PI * 2;
            let pSpeed = Math.random() * 3 + 1;
            particles.push({
                x: x, y: y,
                vx: Math.cos(pAngle) * pSpeed,
                vy: Math.sin(pAngle) * pSpeed,
                life: 1.0,
                color: theme.target
            });
        }
    }

    function toggleAutoMode() {
        initAudio();
        autoMode = !autoMode;
        autoBtn.classList.toggle('active', autoMode);
        autoBtn.innerText = autoMode ? "AUTO: ON" : "AUTO: OFF";
    }

    function togglePause() {
        initAudio();
        isPaused = !isPaused;
        pauseBtn.classList.toggle('active', isPaused);
        pauseBtn.innerText = isPaused ? "REANUDAR" : "PAUSA";
    }

    function toggleGameMode() {
        infiniteMode = !infiniteMode;
        modeBtn.classList.toggle('active', infiniteMode);
        if (infiniteMode) {
            modeLabel.innerText = "Infinito";
            statsRow.innerHTML = `Nivel: <span id="level">${level}</span>`;
        } else {
            modeLabel.innerText = "Arcade";
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Nivel: <span id="level">${level}</span>`;
        }
    }

    function toggleRelaxMode() {
        initAudio();
        relaxMode = !relaxMode;
        relaxBtn.classList.toggle('active', relaxMode);
        if (relaxMode) {
            uiContainer.style.opacity = '0';
            uiContainer.style.pointerEvents = 'none';
            controlsBar.style.opacity = '0';
            controlsBar.style.pointerEvents = 'none';
            floatingExitBtn.style.display = 'block';
        } else {
            uiContainer.style.opacity = '1';
            uiContainer.style.pointerEvents = 'auto';
            controlsBar.style.opacity = '1';
            controlsBar.style.pointerEvents = 'auto';
            floatingExitBtn.style.display = 'none';
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        if (!autoMode && !isPaused && !relaxMode) checkAction();
    }, false);

    function changeTheme() {
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        theme = themes[currentThemeIndex];
        themeLabel.innerText = theme.name;
        themeBtn.innerText = `PALETA: ${currentThemeIndex + 1}/10`;
        mainTitle.style.color = theme.stroke;
        canvas.style.boxShadow = `0 0 30px ${theme.glow}`;
    }

    function changeSpeed() {
        if (gameSpeed === 1.0) gameSpeed = 1.5;
        else if (gameSpeed === 1.5) gameSpeed = 2.0;
        else if (gameSpeed === 2.0) gameSpeed = 0.5;
        else gameSpeed = 1.0;

        speedBtn.innerText = 'VEL: ' + gameSpeed.toFixed(1) + 'x';
    }

    function checkAction() {
        if (isPaused || relaxMode) return;
        initAudio();
        playSynthTone(getDynamicNote(), 'triangle', 0.2);

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);

        let diff = Math.abs(pulseRadius - target.radius);
        let tolerance = Math.max(14, 30 - level * 1.5);

        if (diff < tolerance) {
            if (!infiniteMode) {
                score += Math.round(100 * level * gameSpeed);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('polarHighScore', highScore);
                }
            }

            fails = 0;
            feedbackText = "¡PERFECTO!";
            feedbackColor = theme.stroke;
            screenFlash = 0.4;
            createExplosionParticles(tx, ty);
            playSynthTone(783.99, 'sine', 0.4); 

            level++;
            
            if (infiniteMode) {
                const lvlSpan = document.getElementById('level');
                if (lvlSpan) lvlSpan.innerText = level;
            } else {
                if(scoreEl) scoreEl.innerText = score;
                if(highScoreEl) highScoreEl.innerText = highScore;
                if(levelEl) levelEl.innerText = level;
            }

            generateNewForm();
            resetTarget();
        } else {
            if (!infiniteMode) {
                fails++;
                if (fails >= 4 && level > 1) {
                    level--;
                    fails = 0;
                }
                score = Math.max(0, score - 20);
                if(scoreEl) scoreEl.innerText = score;
                if(levelEl) levelEl.innerText = level;
            }
            feedbackText = "¡FALLO!";
            feedbackColor = "#ff0055";
            playSynthTone(130.81, 'sawtooth', 0.2);
        }
        feedbackTimer = 25;
    }

    function updateAutoMode() {
        if (!autoMode || isPaused || relaxMode) return;
        if (Math.abs(pulseRadius - target.radius) < 2) {
            checkAction();
        }
    }

    function update() {
        if (isPaused) return;

        if (relaxMode) {
            relaxTimer++;
            if (relaxTimer > 280) {
                relaxTimer = 0;
                generateNewForm();
                changeTheme();
            }
        }

        target.angle += target.speed * gameSpeed;

        let pulseSpeedMultiplier = (autoMode || relaxMode) ? 0.7 : gameSpeed;
        let pulseSpeed = (1.2 + (level - 1) * 0.15) * pulseSpeedMultiplier;
        pulseRadius += pulseSpeed;

        if (pulseRadius > 230) {
            if (!autoMode && !relaxMode && !infiniteMode) {
                fails++;
                if (fails >= 4 && level > 1) {
                    level--;
                    fails = 0;
                }
            }
            if (relaxMode) {
                generateNewForm();
                level = Math.floor(Math.random() * 8) + 1;
            }
            resetTarget();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.03;
            if (p.life <= 0) particles.splice(i, 1);
        }

        angle += 0.003 * gameSpeed;
        updateAutoMode();
    }

    function draw() {
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (screenFlash > 0) {
            ctx.fillStyle = theme.stroke;
            ctx.globalAlpha = screenFlash;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            screenFlash -= 0.05;
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = theme.stroke;
        ctx.lineWidth = 2.4;
        ctx.shadowColor = theme.stroke;
        ctx.shadowBlur = 12;
        
        let maxTheta = Math.PI * 20; 
        
        for (let th = 0; th < maxTheta; th += 0.005) {
            let r = 0;
            if (curveType === 'fraction') {
                r = currentScale * Math.sin((num * (th + angle)) / den);
            } else if (curveType === 'pi') {
                r = currentScale * Math.sin(num * (th + angle));
            } else if (curveType === 'multi') {
                r = currentScale * (Math.sin(num * (th + angle)) + Math.cos(den * th));
            } else {
                r = currentScale * Math.cos(num * (th + angle));
            }

            let x = cx + r * Math.cos(th);
            let y = cy + r * Math.sin(th);
            if (th === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        if (!relaxMode) {
            ctx.beginPath();
            ctx.arc(tx, ty, 9, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.shadowColor = theme.target;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = theme.wave;
        ctx.lineWidth = 2;
        ctx.stroke();

        if (isPaused) {
            ctx.font = 'bold 24px monospace';
            ctx.fillStyle = theme.target;
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (!relaxMode && feedbackTimer > 0) {
            ctx.font = 'bold 18px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy - 40);
            feedbackTimer--;
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    generateNewForm();
    resetTarget();
    loop();
</script>

</body>
</html>
