<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Pro Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #03060d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            padding: 5px;
        }
        #ui {
            margin-top: 4px;
            text-align: center;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.7);
            z-index: 10;
            width: 100%;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; color: #ff00ea; text-shadow: 0 0 12px rgba(255, 0, 234, 0.8); }
        .stats-row { margin: 4px 0; font-size: 0.95rem; color: #ffffff; font-weight: bold; text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); }
        .info-row { margin: 3px 0; font-size: 0.85rem; color: #00ffcc; font-weight: bold; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            min-height: 0;
        }
        
        canvas {
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.3);
            background: #050a14;
            border-radius: 50%;
            width: 65vh;
            height: 65vh;
            max-width: 320px;
            max-height: 320px;
        }

        #controls-bar {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            z-index: 10;
            width: 100%;
            padding: 0 10px;
        }

        .button-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background: rgba(0, 255, 255, 0.18);
            border: 2px solid #00ffff;
            color: #ffffff;
            padding: 8px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.7rem;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            transition: all 0.2s ease;
            flex: 1;
            max-width: 110px;
            text-align: center;
        }

        .btn.active {
            background: #ff00ea;
            border-color: #ff00ea;
            color: #ffffff;
            box-shadow: 0 0 15px #ff00ea;
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 20, 0.96);
            border: 2px solid #00ffff;
            padding: 20px;
            border-radius: 15px;
            z-index: 200;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            display: none;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }
        .modal h2 { margin-top: 0; color: #00ffff; font-size: 1.1rem; text-shadow: 0 0 10px rgba(0,255,255,0.8); }
        .setting-group { margin: 10px 0; font-size: 0.75rem; color: #ffffff; font-weight: bold; }
        .setting-group input, .setting-group select { width: 140px; background: #03060d; border: 1px solid #00ffff; color: #00ffff; text-align: center; font-family: inherit; padding: 4px; border-radius: 5px; }

        #achievementToast {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 255, 0.92);
            color: #03060d;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 0 18px #00ffff;
            z-index: 300;
            transition: top 0.4s ease;
            pointer-events: none;
            text-align: center;
        }
        #achievementToast.show { top: 15px; }

        #floatingControls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            gap: 8px;
            z-index: 100;
        }

        .floating-btn {
            background: rgba(0, 255, 255, 0.25);
            border: 2px solid #00ffff;
            color: #ffffff;
            padding: 8px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
            text-shadow: 0 0 8px #00ffff;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                align-items: center;
                padding: 10px;
            }
            #ui { width: 45%; text-align: left; padding-left: 15px; }
            h1 { font-size: 1.2rem; }
            .canvas-container { width: 50%; height: 100vh; }
            canvas { width: 75dvh; height: 75dvh; max-width: 270px; max-height: 270px; }
            #controls-bar { width: 45%; }
            .btn { font-size: 0.6rem; padding: 6px; }
        }
    </style>
</head>
<body>

    <div id="floatingControls">

    <div id="achievementsModal" class="modal">

        <div id="achievementsList" style="font-size: 0.7rem; text-align: left; max-height: 220px; overflow-y: auto; margin-bottom: 10px; padding-right: 5px;"></div>
        <button class="btn active" style="max-width: 100%;" onclick="toggleModal('achievementsModal')">CERRAR</button>
    </div>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY</h1>
        <div class="stats-row" id="statsRow">Ptos: <span id="score">0</span> | Récord: <span id="highScore">0</span> | Nivel: <span id="level">1</span></div>
        <div class="info-row">Modo: <span id="modeLabel">Arcade</span> | Paleta: <span id="themeLabel">Aleatorio</span></div>

        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="controls-bar">
        <div class="button-row">
            <button id="pauseBtn" class="btn" onclick="togglePause()">PAUSA</button>
            <button id="modeBtn" class="btn" onclick="toggleGameMode()">MODO</button>
            <button class="btn" onclick="resetGame()">REINICIAR</button>
        </div>
        <div class="button-row">
            <button class="btn" onclick="toggleModal('settingsModal')">AJUSTES</button>
            <button class="btn" onclick="openAchievements()">LOGROS</button>
            <button id="musicBtn" class="btn active" onclick="toggleMusic()">MÚSICA</button>
        </div>
        <div class="button-row">
            <button class="btn" onclick="nextSongAndForm()">NEXT 🎵</button>
            <button id="relaxBtn" class="btn" onclick="toggleRelaxMode()">RELAX</button>
            <button id="themeBtn" class="btn" onclick="changeTheme()">PALETA: ALEATORIO</button>
        </div>
        <div class="button-row">
            <button id="speedBtn" class="btn" onclick="changeSpeed()">VEL: 1.0x</button>
            <button id="autoBtn" class="btn" onclick="toggleAutoMode()">AUTO: OFF</button>
            <button class="btn" style="background: rgba(0,255,170,0.25); border-color: #00ffaa; color: #ffffff;" onclick="document.getElementById('localMusicInput').click()">CARPETA 📂</button>
            <input type="file" id="localMusicInput" webkitdirectory directory multiple accept="audio/*" style="display: none;" onchange="loadLocalMusic(event)">
        </div>
    </div>
   <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statsRow = document.getElementById('statsRow');
    const modeLabel = document.getElementById('modeLabel');
    const themeLabel = document.getElementById('themeLabel');
    const mainTitle = document.getElementById('mainTitle');
    const autoBtn = document.getElementById('autoBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const relaxBtn = document.getElementById('relaxBtn');
    const themeBtn = document.getElementById('themeBtn');
    const modeBtn = document.getElementById('modeBtn');
    const musicBtn = document.getElementById('musicBtn');
    const uiContainer = document.getElementById('ui');
    const controlsBar = document.getElementById('controls-bar');
    const floatingControls = document.getElementById('floatingControls');
    const achievementToast = document.getElementById('achievementToast');

    let score = 0;
    let highScore = localStorage.getItem('polarHighScorePro') || 0;
    document.getElementById('highScore').innerText = highScore;

    let level = 1;
    let successfulHits = 0;
    let consecutiveFails = 0;
    let perfectStreak = 0; 
    let themesExplored = 0;
    
    let requiredHitsForLevel = 1;
    let maxFailsForPenalty = 3;
    let fxVolume = 0.3;
    let musicVolume = 0.5;
    let curveVarietyMode = 'pretty'; 
    let layerCount = 1; 

    let musicMode = 1; // 1: SECUENCIAL, 2: ALEATORIO, 0: OFF
    let currentTrackIndex = 1;
    const totalTracks = 53;
    let mp3Player = new Audio();
    mp3Player.volume = musicVolume;

    let localPlaylist = [];
    let isUsingLocalMusic = false;

    function loadLocalMusic(event) {
        const files = event.target.files;
        if (files.length > 0) {
            localPlaylist = [];
            for (let i = 0; i < files.length; i++) {
                if (files[i].type.startsWith('audio/') || files[i].name.match(/\.(mp3|wav|ogg|m4a|flac)$/i)) {
                    localPlaylist.push(URL.createObjectURL(files[i]));
                }
            }
            if (localPlaylist.length > 0) {
                isUsingLocalMusic = true;
                currentTrackIndex = 0;
                musicBtn.classList.add('active');
                musicBtn.innerText = musicMode === 1 ? `CARP: SEC` : `CARP: ALE`;
                playTrack();
            } else {
                alert("No se encontraron archivos de audio válidos en la carpeta seleccionada.");
            }
        }
    }

    function playTrack() {
        if (isUsingLocalMusic) {
            if (localPlaylist.length === 0) return;
            if (musicMode === 2) {
                currentTrackIndex = Math.floor(Math.random() * localPlaylist.length);
            }
            mp3Player.src = localPlaylist[currentTrackIndex];
            mp3Player.play().catch(e => console.log("Reproducción automática pendiente de interacción del navegador", e));
            if (musicMode === 1) {
                currentTrackIndex = (currentTrackIndex + 1) % localPlaylist.length;
            }
        } else {
            if (musicMode === 0) return;
            if (musicMode === 1) {
                currentTrackIndex++;
                if (currentTrackIndex > totalTracks) currentTrackIndex = 1;
            } else if (musicMode === 2) {
                currentTrackIndex = Math.floor(Math.random() * totalTracks) + 1;
            }
            let trackStr = String(currentTrackIndex).padStart(3, '0');
            mp3Player.src = `multimedia/${trackStr}.mp3`;
            mp3Player.play().catch(e => console.log("Reproducción automática pendiente de interacción del navegador", e));
        }
    }

    mp3Player.addEventListener('ended', () => {
        if (musicMode > 0) playTrack();
    });

    function toggleMusic() {
        initAudioContext();
        musicMode = (musicMode + 1) % 3;
        let prefix = isUsingLocalMusic ? "CARP" : "MÚSICA";
        if (musicMode === 0) {
            musicBtn.classList.remove('active');
            musicBtn.innerText = `${prefix}: OFF`;
            mp3Player.pause();
        } else if (musicMode === 1) {
            musicBtn.classList.add('active');
            musicBtn.innerText = `${prefix}: SEC`;
            playTrack();
        } else {
            musicBtn.classList.add('active');
            musicBtn.innerText = `${prefix}: ALE`;
            playTrack();
        }
    }

    function nextSongAndForm() {
        initAudioContext();
        playTrack();
        generateNewForm();
        if (isRandomThemeMode) applyRandomTheme();
        resetTarget();
    }
        let autoMode = false;
    let isPaused = false;
    let relaxMode = false;
    let gameMode = 'arcade';
    let timeAttackSeconds = 60;
    let timeAttackTimer = null;
    let gameSpeed = 1.0;
    let angle = 0;
    
    let activeCurves = [
        { type: 'rhodonea', p1: 5, p2: 6, p3: 2, scale: 195 },
        { type: 'lemniscate', p1: 4, p2: 3, p3: 1, scale: 145 },
        { type: 'star', p1: 3, p2: 2, p3: 1, scale: 100 },
        { type: 'trifolio', p1: 2, p2: 1, p3: 1, scale: 65 }
    ];

    let relaxTimer = 0;
    let screenShake = 0;
    let floatingTexts = [];

    let achievements = [
        { id: 'first_perfect', name: 'Primer Impacto', desc: 'Consigue tu primer acierto', unlocked: false },
        { id: 'streak_3', name: 'Racha de Bronce', desc: 'Consigue 3 aciertos seguidos', unlocked: false },
        { id: 'streak_7', name: 'Racha de Plata', desc: 'Consigue 7 aciertos seguidos', unlocked: false },
        { id: 'streak_15', name: 'Racha de Oro', desc: 'Consigue 15 aciertos seguidos', unlocked: false },
        { id: 'level_10', name: 'Explorador Polar', desc: 'Alcanza el nivel 10', unlocked: false },
        { id: 'level_25', name: 'Maestro Polar', desc: 'Alcanza el nivel 25', unlocked: false },
        { id: 'level_50', name: 'Leyenda Viva', desc: 'Alcanza el nivel 50', unlocked: false },
        { id: 'score_1000', name: 'Fiebre Neón', desc: 'Supera los 1.000 puntos', unlocked: false },
        { id: 'score_5000', name: 'Dios del Neón', desc: 'Supera los 5.000 puntos', unlocked: false },
        { id: 'score_10000', name: 'Infinito', desc: 'Supera los 10.000 puntos', unlocked: false },
        { id: 'speed_demon', name: 'Velocidad Luz', desc: 'Juega a velocidad 3.0x', unlocked: false },
        { id: 'zen_mode', name: 'Modo Zen', desc: 'Activa el modo Relax', unlocked: false },
        { id: 'auto_pilot', name: 'Piloto', desc: 'Activa el modo Auto', unlocked: false },
        { id: 'palette_master', name: 'Coleccionista', desc: 'Explora 10 paletas distintas', unlocked: false },
        { id: 'survivor', name: 'Resiliencia', desc: 'Sobrevive a una penalización', unlocked: false }
    ];

    const themes = [
        { name: 'Cyber Neon', bg: '#050a14', strokes: ['#00ffff', '#00ccff', '#0099ff', '#0055ff'], target: '#ff00ea', wave: 'rgba(0, 255, 255, 0.85)', glow: 'rgba(0, 255, 255, 0.35)' },
        { name: 'Matrix Cyber', bg: '#020f04', strokes: ['#00ff55', '#adff2f', '#7fff00', '#32cd32'], target: '#ffffff', wave: 'rgba(0, 255, 85, 0.85)', glow: 'rgba(0, 255, 85, 0.35)' },
        { name: 'Laser Purple', bg: '#0e0214', strokes: ['#bf00ff', '#da70d6', '#ba55d3', '#dda0dd'], target: '#00ffff', wave: 'rgba(0, 255, 255, 0.85)', glow: 'rgba(191, 0, 255, 0.35)' },
        { name: 'Retro Amstrad', bg: '#021008', strokes: ['#33ff33', '#66ff66', '#99ff99', '#ccffcc'], target: '#ffff33', wave: 'rgba(255, 255, 51, 0.85)', glow: 'rgba(51, 255, 51, 0.35)' },
        { name: 'Sunset Vibe', bg: '#14050a', strokes: ['#ff3366', '#ff6699', '#ff99cc', '#ffcc00'], target: '#00ffff', wave: 'rgba(0, 255, 255, 0.85)', glow: 'rgba(255, 51, 102, 0.35)' },
        { name: 'Acid Lime', bg: '#0f1402', strokes: ['#ccff00', '#adff2f', '#ffff00', '#7fff00'], target: '#ff00ff', wave: 'rgba(255, 0, 255, 0.85)', glow: 'rgba(204, 255, 0, 0.35)' },
        { name: 'Gold Imperial', bg: '#120c02', strokes: ['#ffaa00', '#ffcc00', '#ffea75', '#ffffff'], target: '#ffffff', wave: 'rgba(255, 255, 255, 0.85)', glow: 'rgba(255, 170, 0, 0.35)' },
        { name: 'Deep Frost', bg: '#020a14', strokes: ['#00ccff', '#3399ff', '#66ccff', '#ffffff'], target: '#ffffff', wave: 'rgba(0, 204, 255, 0.85)', glow: 'rgba(0, 204, 255, 0.35)' },
        { name: 'Crimson Blood', bg: '#140202', strokes: ['#ff3333', '#ff6666', '#ff9999', '#ffffff'], target: '#ffffff', wave: 'rgba(255, 255, 255, 0.85)', glow: 'rgba(255, 51, 51, 0.35)' },
        { name: 'Neon Vio', bg: '#0a0212', strokes: ['#00ffaa', '#00e699', '#00cc88', '#ff00ea'], target: '#ff00ea', wave: 'rgba(255, 0, 234, 0.85)', glow: 'rgba(0, 255, 170, 0.35)' }
    ];
    let currentThemeIndex = 0;
    let theme = themes[0];
    let isRandomThemeMode = true;

    let pulseRadius = 0;
    let feedbackTimer = 0;
    let feedbackText = '';
    let feedbackColor = '#00ffff';
    let screenFlash = 0;
    let particles = [];
    let targetParticles = [];

    let target = {
        angle: Math.random() * Math.PI * 2,
        radius: 175,
        speed: 0.005
    };

    function resetAchievements() {
        achievements.forEach(a => a.unlocked = false);
        achievementToast.innerText = "¡Logros Reseteados!";
        achievementToast.classList.add('show');
        setTimeout(() => achievementToast.classList.remove('show'), 3000);
        if(document.getElementById('achievementsModal').style.display === 'block') {
            openAchievements();
        }
    }

    function unlockAchievement(id) {
        let ach = achievements.find(a => a.id === id);
        if (ach && !ach.unlocked) {
            ach.unlocked = true;
            achievementToast.innerText = `🏆 ¡Logro: ${ach.name}!`;
            achievementToast.classList.add('show');
            setTimeout(() => achievementToast.classList.remove('show'), 3500);
        }
    }

    function openAchievements() {
        let listEl = document.getElementById('achievementsList');
        listEl.innerHTML = '';
        achievements.forEach(a => {
            listEl.innerHTML += `<div style="margin:6px 0; color:${a.unlocked ? '#00ffff' : '#666'}; border-bottom: 1px solid #111; padding-bottom: 4px;"><b>${a.name}</b> (${a.unlocked ? '✔' : '🔒'})<br><span style="font-size:0.6rem; color:#aaa;">${a.desc}</span></div>`;
        });
        toggleModal('achievementsModal');
    }

    function toggleModal(id) {
        let m = document.getElementById(id);
        m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    function resetTarget() {
        target.angle = Math.random() * Math.PI * 2;
        target.radius = 65 + Math.random() * 100;
        target.speed = (Math.random() > 0.5 ? 1 : -1) * (0.003 + (level * 0.0007));
        pulseRadius = 0;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudioContext() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function generateNewForm() {
        const prettyCurves = [
            'rhodonea', 'roseFrac', 'piWave', 'grandisRose', 'trifolio', 'cuatrifolio',
            'cardioidLim', 'lemniscate', 'epicycloid', 'star', 'flower', 'octagram', 'decagram'
        ];
        
        const allCurves = [
            ...prettyCurves,
            'harmonic', 'lissajous', 'butterfly', 'spirograph', 'gear',
            'epitrochoid', 'hypotrochoid', 'cazoleta', 'logSpiral', 'cornu',
            'astroide', 'deltoide', 'hypocycloid', 'polyRose', 'nephroid',
            'limacon', 'parabolicHelix', 'superEllipse', 'sinusoidalGrid',
            'toroidalWave', 'hyperbolicSpiral', 'omegaSpiral'
        ];

        const pool = (curveVarietyMode === 'pretty') ? prettyCurves : allCurves;

        activeCurves = [];
        let baseScales = [195, 150, 105, 65]; 

        for (let i = 0; i < 4; i++) {
            let valid = false;
            let attempts = 0;
            let curveObj = {};

            while (!valid && attempts < 50) {
                attempts++;
                let cType = pool[Math.floor(Math.random() * pool.length)];
                if (i > 0 && activeCurves.some(c => c.type === cType)) continue;

                let maxParam = (i >= 2) ? 2 : 5;
                let minParam = 1;
                let tp1 = Math.floor(Math.random() * (maxParam - minParam + 1)) + minParam;
                let tp2 = Math.floor(Math.random() * 3) + 1;
                let tp3 = Math.floor(Math.random() * 2) + 1;

                if (testCurveQuality(cType, tp1, tp2)) {
                    curveObj = { type: cType, p1: tp1, p2: tp2, p3: tp3, scale: baseScales[i] };
                    valid = true;
                }
            }
            if (!valid) {
                curveObj = { type: 'trifolio', p1: 1, p2: 1, p3: 1, scale: baseScales[i] };
            }
            activeCurves.push(curveObj);
        }
    }

    function testCurveQuality(cType, tp1, tp2) {
        let maxVal = 0;
        let minVal = 9999;
        let testSteps = 80;
        for (let i = 0; i < testSteps; i++) {
            let th = (i / testSteps) * Math.PI * 16;
            let rawR = Math.abs(getRawPolarRadiusForTest(cType, tp1, tp2, th, 0));
            if (!isNaN(rawR) && rawR < 1000) {
                if (rawR > maxVal) maxVal = rawR;
                if (rawR < minVal) minVal = rawR;
            }
        }
        if (maxVal < 25) return false;
        if ((maxVal - minVal) < (maxVal * 0.25)) return false; 
        return true;
    }

    function getRawPolarRadiusForTest(cType, tp1, tp2, th, currentAngle) {
        let t = th + currentAngle;
        switch(cType) {
            case 'rhodonea': return Math.cos((tp1 * t) / tp2) * 100;
            case 'roseFrac': return Math.sin((tp1 * t) / tp2) * 100;
            case 'piWave': return Math.sin(tp1 * Math.PI * t / tp2) * 105;
            case 'grandisRose': return (Math.sin(tp1 * t / 3) * Math.cos(tp2 * t / 2)) * 100;
            case 'trifolio': return Math.sin(3 * t) * 100;
            case 'cuatrifolio': return Math.cos(2 * t) * 100;
            case 'cardioidLim': return (1 + 0.6 * Math.cos(tp1 * t)) * 95;
            case 'lemniscate': return Math.sqrt(Math.abs(Math.cos(tp1 * t))) * 110;
            case 'epicycloid': return (Math.sin(tp1 * t) * Math.cos(tp2 * th)) * 100;
            case 'star': return (1 - 0.35 * Math.abs(Math.sin(tp1 * t / 2))) * 105;
            case 'flower': return (0.5 + 0.5 * Math.cos(tp1 * t)) * 110;
            default: return Math.sin(tp1 * t) * 100;
        }
    }

    function calculatePolarRadiusForCurve(curve, th, currentAngle) {
        let t = th + currentAngle;
        let raw = 100;
        let tp1 = curve.p1, tp2 = curve.p2, tp3 = curve.p3;

        switch(curve.type) {
            case 'rhodonea': raw = Math.cos((tp1 * t) / tp2) * 100; break;
            case 'roseFrac': raw = Math.sin((tp1 * t) / tp2) * 100; break;
            case 'piWave': raw = Math.sin(tp1 * Math.PI * t / tp2) * 105; break;
            case 'grandisRose': raw = (Math.sin(tp1 * t / 3) * Math.cos(tp2 * t / 2)) * 100; break;
            case 'trifolio': raw = Math.sin(3 * t) * 100; break;
            case 'cuatrifolio': raw = Math.cos(2 * t) * 100; break;
            case 'cardioidLim': raw = (1 + 0.6 * Math.cos(tp1 * t)) * 95; break;
            case 'lemniscate': raw = Math.sqrt(Math.abs(Math.cos(tp1 * t))) * 110; break;
            case 'epicycloid': raw = (Math.sin(tp1 * t) * Math.cos(tp2 * th)) * 100; break;
            case 'star': raw = (1 - 0.35 * Math.abs(Math.sin(tp1 * t / 2))) * 105; break;
            case 'flower': raw = (0.5 + 0.5 * Math.cos(tp1 * t)) * 110; break;
            case 'octagram': raw = Math.cos(4 * t) * 105; break;
            case 'decagram': raw = Math.cos(5 * t) * 105; break;
            case 'harmonic': raw = (Math.sin(tp1 * t) + Math.cos(tp2 * th) / tp3) * 90; break;
            case 'lissajous': raw = Math.sin(tp1 * t) * Math.cos(tp2 * t) * 100; break;
            case 'butterfly': raw = (Math.exp(Math.cos(t)) - 2 * Math.cos(4*t)) * 45; break;
            case 'spirograph': raw = (0.8 * Math.cos(tp1 * t) + 0.3 * Math.cos(tp2 * t)) * 100; break;
            case 'gear': raw = (1 + 0.2 * Math.sin(tp1 * tp2 * t)) * 95; break;
            case 'epitrochoid': raw = (1.2 * Math.cos(tp1 * t) - 0.4 * Math.cos(tp2 * t)) * 90; break;
            case 'hypotrochoid': raw = (0.9 * Math.sin(tp1 * t) + 0.3 * Math.sin(tp3 * t)) * 95; break;
            case 'cazoleta': raw = (Math.sin(tp1 * t) * Math.sin(tp2 * t)) * 100; break;
            case 'logSpiral': raw = Math.exp(0.08 * Math.sin(t)) * 85; break;
            case 'cornu': raw = Math.sin(t * t * 0.08) * 95; break;
            case 'astroide': raw = Math.pow(Math.abs(Math.cos(t)), 3) * 105; break;
            case 'deltoide': raw = (2 * Math.cos(t) + Math.cos(2 * t)) * 65; break;
            case 'hypocycloid': raw = ((tp1-1)*Math.cos(t) + Math.cos((tp1-1)*t)) * 55; break;
            case 'polyRose': raw = (Math.sin(tp1 * t) * Math.sin(tp2 * t)) * 100; break;
            case 'nephroid': raw = (1 + 2 * Math.sin(t/2)) * 70; break;
            case 'limacon': raw = (0.5 + Math.cos(t)) * 95; break;
            case 'parabolicHelix': raw = Math.tan(t * 0.1) * 40; break;
            case 'superEllipse': raw = Math.pow(Math.abs(Math.cos(t)), 2/tp1) * 95; break;
            case 'sinusoidalGrid': raw = (Math.sin(tp1*t) + Math.sin(tp2*t)) * 90; break;
            case 'toroidalWave': raw = (Math.cos(tp1*t) * Math.sin(tp2*t)) * 95; break;
            case 'hyperbolicSpiral': raw = (65 / (t + 0.5)); break;
            case 'omegaSpiral': raw = (Math.sin(t) * Math.cos(t * 0.5)) * 95; break;
            default: raw = Math.sin(tp1 * t) * 100; break;
        }
        return curve.scale * (raw / 100);
         }
           function createExplosionParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            let pAngle = Math.random() * Math.PI * 2;
            let pSpeed = Math.random() * 3 + 1;
            particles.push({ x: x, y: y, vx: Math.cos(pAngle) * pSpeed, vy: Math.sin(pAngle) * pSpeed, life: 1.0, color: theme.target });
        }
    }

    function toggleAutoMode() {
        initAudioContext();
        autoMode = !autoMode;
        autoBtn.classList.toggle('active', autoMode);
        autoBtn.innerText = autoMode ? "AUTO: ON" : "AUTO: OFF";
        if (autoMode) unlockAchievement('auto_pilot');
    }

    function togglePause() {
        initAudioContext();
        isPaused = !isPaused;
        pauseBtn.classList.toggle('active', isPaused);
        pauseBtn.innerText = isPaused ? "REANUDAR" : "PAUSA";
    }

    function updateSettings() {
        curveVarietyMode = document.getElementById('curveVarietySelect').value;
        layerCount = parseInt(document.getElementById('layerCountSelect').value) || 1;
        requiredHitsForLevel = parseInt(document.getElementById('hitsPerLevelInput').value) || 1;
        maxFailsForPenalty = parseInt(document.getElementById('failsPerPenaltyInput').value) || 3;
        fxVolume = parseFloat(document.getElementById('fxVolInput').value);
        musicVolume = parseFloat(document.getElementById('musicVolInput').value);
        mp3Player.volume = musicVolume;
    }

    function toggleGameMode() {
        if (gameMode === 'arcade') {
            gameMode = 'infinite';
            modeLabel.innerText = "Infinito";
        } else if (gameMode === 'infinite') {
            gameMode = 'timeAttack';
            modeLabel.innerText = "Contrarreloj";
            startTimeAttack();
        } else if (gameMode === 'timeAttack') {
            gameMode = 'ghost';
            modeLabel.innerText = "Fantasma";
            if (timeAttackTimer) clearInterval(timeAttackTimer);
        } else {
            gameMode = 'arcade';
            modeLabel.innerText = "Arcade";
        }
        modeBtn.classList.add('active');
        consecutiveFails = 0;
        successfulHits = 0;
        perfectStreak = 0;
        updateDOMStats();
    }

    function startTimeAttack() {
        timeAttackSeconds = 60;
        if (timeAttackTimer) clearInterval(timeAttackTimer);
        timeAttackTimer = setInterval(() => {
            if (!isPaused && !relaxMode && gameMode === 'timeAttack') {
                timeAttackSeconds--;
                updateDOMStats();
                if (timeAttackSeconds <= 0) {
                    clearInterval(timeAttackTimer);
                    alert("¡Tiempo agotado! Puntuación final: " + score);
                    resetGame();
                }
            }
        }, 1000);
    }

    function updateDOMStats() {
        if (gameMode === 'infinite') {
            statsRow.innerHTML = `Nivel: <span id="level">${level}</span> | Racha: ${perfectStreak}`;
        } else if (gameMode === 'timeAttack') {
            statsRow.innerHTML = `T: ${timeAttackSeconds}s | Ptos: ${score} | Lvl: <span id="level">${level}</span>`;
        } else if (gameMode === 'ghost') {
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Lvl: <span id="level">${level}</span>`;
        } else {
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Lvl: <span id="level">${level}</span>`;
        }
    }

    function applyRandomTheme() {
        let randomHex = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        theme = {
            name: 'Aleatorio',
            bg: '#03060d',
            strokes: [randomHex(), randomHex(), randomHex(), randomHex()],
            target: randomHex(),
            wave: 'rgba(0, 255, 255, 0.85)',
            glow: 'rgba(0, 255, 255, 0.35)'
        };
        mainTitle.style.color = theme.strokes[0];
        canvas.style.boxShadow = `0 0 35px ${theme.glow}`;
    }

    function changeTheme() {
        isRandomThemeMode = false;
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        theme = themes[currentThemeIndex];
        themeLabel.innerText = theme.name;
        themeBtn.innerText = `PALETA: ${currentThemeIndex + 1}/10`;
        mainTitle.style.color = theme.strokes[0];
        canvas.style.boxShadow = `0 0 35px ${theme.glow}`;
        
        themesExplored++;
        if (themesExplored >= 10) unlockAchievement('palette_master');
    }

    function changeSpeed() {
        if (gameSpeed === 1.0) gameSpeed = 1.5;
        else if (gameSpeed === 1.5) gameSpeed = 2.0;
        else if (gameSpeed === 2.0) { gameSpeed = 3.0; unlockAchievement('speed_demon'); }
        else if (gameSpeed === 3.0) gameSpeed = 0.25;
        else if (gameSpeed === 0.25) gameSpeed = 0.5;
        else gameSpeed = 1.0;
        speedBtn.innerText = 'VEL: ' + gameSpeed.toFixed(2).replace(/\.?0+$/, '') + 'x';
    }

    function resetGame() {
        score = 0;
        level = 1;
        consecutiveFails = 0;
        successfulHits = 0;
        perfectStreak = 0;
        pulseRadius = 0;
        floatingTexts = [];

        if (gameMode === 'timeAttack') startTimeAttack();
        generateNewForm();
        resetTarget();
        updateDOMStats();
    }

    function toggleRelaxMode() {
        initAudioContext();
        relaxMode = !relaxMode;
        relaxBtn.classList.toggle('active', relaxMode);
        if (relaxMode) {
            unlockAchievement('zen_mode');
            uiContainer.style.opacity = '0';
            uiContainer.style.pointerEvents = 'none';
            controlsBar.style.opacity = '0';
            controlsBar.style.pointerEvents = 'none';
            floatingControls.style.display = 'flex';
        } else {
            uiContainer.style.opacity = '1';
            uiContainer.style.pointerEvents = 'auto';
            controlsBar.style.opacity = '1';
            controlsBar.style.pointerEvents = 'auto';
            floatingControls.style.display = 'none';
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (!autoMode && !isPaused && !relaxMode) checkAction();
    }, false);

    function checkAction() {
        if (isPaused || relaxMode) return;
        initAudioContext();
        
        if(audioCtx && audioCtx.state === 'running') {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);

        let diff = Math.abs(pulseRadius - target.radius);
        let tolerance = 25;

        if (diff < tolerance) {
            consecutiveFails = 0;
            successfulHits++;
            perfectStreak++;
            
            unlockAchievement('first_perfect');
            if (perfectStreak >= 3) unlockAchievement('streak_3');
            if (perfectStreak >= 7) unlockAchievement('streak_7');
            if (perfectStreak >= 15) unlockAchievement('streak_15');

            if (perfectStreak > 1) {
                floatingTexts.push({ x: cx, y: cy - 30, text: `COMBO x${perfectStreak}!`, life: 1.0, color: theme.strokes[0] });
            }

            if (gameMode !== 'infinite') {
                let ghostBonus = (gameMode === 'ghost') ? 50 : 0;
                score += 100 + ghostBonus + (level * (gameMode === 'timeAttack' ? 25 : 10)) + (perfectStreak * 10);
                if (gameMode === 'timeAttack') timeAttackSeconds += 3;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('polarHighScorePro', highScore);
                    if (highScore >= 1000) unlockAchievement('score_1000');
                    if (highScore >= 5000) unlockAchievement('score_5000');
                    if (highScore >= 10000) unlockAchievement('score_10000');
                }
            }

            feedbackText = "¡PERFECTO!";
            feedbackColor = theme.strokes[0];
            screenFlash = 0.4;
            createExplosionParticles(tx, ty);

            if (successfulHits >= requiredHitsForLevel) {
                level++;
                successfulHits = 0;
                if (isRandomThemeMode) applyRandomTheme();
                if (level >= 10) unlockAchievement('level_10');
                if (level >= 25) unlockAchievement('level_25');
                if (level >= 50) unlockAchievement('level_50');
            }

            generateNewForm();
            resetTarget();
        } else {
            consecutiveFails++;
            perfectStreak = 0;
            screenShake = 10;

            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                successfulHits = 0;
                if (gameMode === 'infinite' || gameMode === 'arcade' || gameMode === 'ghost') {
                    if (level > 1) unlockAchievement('survivor');
                    level = Math.max(1, level - 1);
                    feedbackText = "¡BAJAS NIVEL!";
                } else {
                    score = 0;
                    feedbackText = "¡PUNTOS A CERO!";
                }
            } else {
                if (gameMode !== 'infinite') score = Math.max(0, score - 15);
                feedbackText = "¡FALLO!";
            }
            feedbackColor = "#ffaa00";
        }
        
        updateDOMStats();
        feedbackTimer = 35;
    }
           function update() {
        if (isPaused) return;
        if (screenShake > 0) screenShake *= 0.85;

        if (relaxMode) {
            relaxTimer++;
            if (relaxTimer > 250) {
                relaxTimer = 0;
                generateNewForm();
                if(isRandomThemeMode) applyRandomTheme();
            }
        }

        target.angle += target.speed * gameSpeed;

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        let isGhostInvisible = (gameMode === 'ghost' && pulseRadius > 80);
        
        if (!isGhostInvisible) {
            targetParticles.push({ x: tx, y: ty, life: 1.0 });
        }

        for (let i = targetParticles.length - 1; i >= 0; i--) {
            targetParticles[i].life -= 0.1;
            if (targetParticles[i].life <= 0) targetParticles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].y -= 0.8;
            floatingTexts[i].life -= 0.02;
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }

        pulseRadius += (1.2 + (level * 0.05)) * gameSpeed;

        if (pulseRadius > 230) {
            consecutiveFails++;
            perfectStreak = 0;
            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                if (level > 1) unlockAchievement('survivor');
                if (gameMode === 'infinite') level = Math.max(1, level - 1);
                else score = 0;
                updateDOMStats();
            }
            resetTarget();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.04;
            if (p.life <= 0) particles.splice(i, 1);
        }

        angle += 0.003 * gameSpeed;
        if (autoMode && Math.abs(pulseRadius - target.radius) < 2) checkAction();
    }

    function draw() {
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        ctx.fillStyle = theme.bg;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;

        if (screenFlash > 0) {
            ctx.fillStyle = theme.strokes[0];
            ctx.globalAlpha = screenFlash;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            screenFlash -= 0.05;
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        let opacities = [1.0, 0.75, 0.55, 0.35];
        let rotations = [angle, -angle * 1.2, angle * 0.7 + Math.PI / 4, -angle * 0.4];

        for (let l = 0; l < Math.min(layerCount, activeCurves.length); l++) {
            let curve = activeCurves.get ? activeCurves[l] : activeCurves[l];
            ctx.beginPath();
            ctx.strokeStyle = theme.strokes[l % theme.strokes.length];
            ctx.lineWidth = (l === 0) ? 2.5 : 1.8;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.shadowBlur = (l === 0) ? 12 : 5;
            ctx.globalAlpha = opacities[l];
            
            let maxTheta = Math.PI * 16;
            for (let th = 0; th < maxTheta; th += 0.01) {
                let r = calculatePolarRadiusForCurve(curve, th, rotations[l]);
                let x = cx + r * Math.cos(th);
                let y = cy + r * Math.sin(th);
                if (th === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;

        for (let tp of targetParticles) {
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.globalAlpha = tp.life * 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        let isGhostInvisible = (gameMode === 'ghost' && pulseRadius > 80);
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        if (!relaxMode && !isGhostInvisible) {
            ctx.beginPath();
            ctx.arc(tx, ty, 8, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.shadowColor = theme.target;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = theme.wave;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        for (let ft of floatingTexts) {
            ctx.font = 'bold 15px monospace';
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = ft.life;
            ctx.textAlign = 'center';
            ctx.shadowColor = ft.color;
            ctx.shadowBlur = 10;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        if (isPaused) {
            ctx.font = 'bold 22px monospace';
            ctx.fillStyle = theme.target;
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (!relaxMode && feedbackTimer > 0) {
            ctx.font = 'bold 18px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy + 40);
            feedbackTimer--;
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
    requestAnimationFrame(loop);
    }

    applyRandomTheme();
    generateNewForm();
    resetTarget();
    loop();

    // Intento de reproducción automática inicial al cargar la página
    playTrack();
    
    // Gestor universal: si el navegador bloquea el audio al cargar, suena al primer toque en cualquier parte de la pantalla
    window.addEventListener('pointerdown', () => {
        initAudioContext();
        if (musicMode > 0 && mp3Player.paused) {
            playTrack();
        }
    }, { once: true });
</script>
