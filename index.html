<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Pro Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #03060d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            padding: 8px;
        }
        #ui {
            margin-top: 6px;
            text-align: center;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.7);
            z-index: 20;
            width: 100%;
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 2px; color: #00ffcc; text-shadow: 0 0 14px rgba(0, 255, 204, 0.8); font-family: 'Courier New', Courier, monospace; }
        .stats-row { margin: 6px 0; font-size: 1.05rem; color: #ffffff; font-weight: bold; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        .info-row { margin: 4px 0; font-size: 0.95rem; color: #00ccff; font-weight: bold; text-shadow: 0 0 8px rgba(0, 204, 255, 0.7); }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            min-height: 0;
            z-index: 10;
        }
        
        canvas {
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            background: #050a14;
            border-radius: 50%;
            width: 72vh;
            height: 72vh;
            max-width: 350px;
            max-height: 350px;
        }

        #controls-bar {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            z-index: 20;
            width: 100%;
            padding: 0 5px;
        }

        .button-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background: rgba(0, 180, 216, 0.15);
            border: 2px solid #00b4d8;
            color: #e0fbfc;
            padding: 10px 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.3);
            transition: all 0.2s ease;
            flex: 1;
            max-width: 120px;
            text-align: center;
        }

        .btn.active {
            background: rgba(0, 255, 204, 0.25);
            border-color: #00ffcc;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(0, 255, 204, 0.6);
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 10, 20, 0.98);
            border: 2px solid #00b4d8;
            padding: 20px;
            border-radius: 16px;
            z-index: 200;
            box-shadow: 0 0 35px rgba(0, 180, 216, 0.5);
            display: none;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        .modal h2 { margin-top: 0; color: #00ffcc; font-size: 1.2rem; text-shadow: 0 0 12px rgba(0,255,204,0.8); font-family: 'Courier New', Courier, monospace; }
        .setting-group { margin: 10px 0; font-size: 0.85rem; color: #ffffff; font-weight: bold; text-align: left; }
        .setting-group input, .setting-group select { width: 100%; background: #03060d; border: 2px solid #00b4d8; color: #00ffcc; text-align: center; font-family: inherit; padding: 6px; border-radius: 8px; margin-top: 4px; font-size: 0.9rem; }

        .achievement-item {
            background: rgba(0, 180, 216, 0.08);
            border: 1px solid rgba(0, 180, 216, 0.25);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .achievement-item.unlocked {
            background: rgba(0, 255, 204, 0.12);
            border-color: #00ffcc;
        }
        .achievement-title {
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .achievement-desc {
            font-size: 0.72rem;
            color: #a0aec0;
        }

        #achievementToast {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 204, 0.95);
            color: #03060d;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 0 20px #00ffcc;
            z-index: 300;
            transition: top 0.4s ease;
            pointer-events: none;
            text-align: center;
        }
        #achievementToast.show { top: 15px; }

        #trackToast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 180, 216, 0.95);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 22px rgba(0, 180, 216, 0.8);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            max-width: 94%;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 2px solid #ffffff;
        }
        #trackToast.show { opacity: 1; }

        #floatingControls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            gap: 8px;
            z-index: 100;
        }

        .floating-btn {
            background: rgba(0, 180, 216, 0.25);
            border: 2px solid #00b4d8;
            color: #ffffff;
            padding: 10px 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(0, 180, 216, 0.6);
            text-shadow: 0 0 8px #00b4d8;
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                align-items: center;
                padding: 10px;
            }
            #ui { width: 45%; text-align: left; padding-left: 15px; }
            h1 { font-size: 1.3rem; }
            .canvas-container { width: 50%; height: 100vh; }
            canvas { width: 75dvh; height: 75dvh; max-width: 290px; max-height: 290px; }
            #controls-bar { width: 45%; }
            .btn { font-size: 0.65rem; padding: 7px; }
        }
    </style>
</head>
<body>

    <div id="floatingControls">
        <button class="floating-btn" onclick="toggleModal('relaxModal')">⚙️ TIPO</button>
        <button class="floating-btn" onclick="nextSongAndForm()">NEXT 🎵</button>
        <button class="floating-btn" onclick="toggleRelaxMode()">SALIR</button>
    </div>
    <div id="achievementToast">🏆 ¡Logro Desbloqueado!</div>
    <div id="trackToast">🎵 Reproduciendo pista</div>

    <div id="relaxModal" class="modal">
        <h2>MODO RELAX: VARIANTE</h2>
        <div class="setting-group">
            <label>Selecciona el tipo de función:</label>
            <select id="relaxVariantSelect" onchange="updateRelaxVariant()">
                <option value="curves">Forma Principal (Polares Bonitas)</option>
                <option value="petals">Pétalos Geométricos</option>
                <option value="combined">Combinación (Curvas + Pétalos)</option>
            </select>
        </div>
        <div style="margin-top: 14px;">
            <button class="btn active" style="max-width: 100%;" onclick="toggleModal('relaxModal')">APLICAR Y CERRAR</button>
        </div>
    </div>
        <div id="settingsModal" class="modal">
        <h2>AJUSTES Y MODIFICADORES</h2>
        <div class="setting-group">
            <label>Tipo de Trazados:</label>
            <select id="curveVarietySelect" onchange="updateSettings()">
                <option value="pretty">Solo Polares Bonitas</option>
                <option value="all">Variedad Completa</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Capas Superpuestas:</label>
            <select id="layerCountSelect" onchange="updateSettings()">
                <option value="1">1 (Normal)</option>
                <option value="2">2 (Doble)</option>
                <option value="3">3 (Triple)</option>
                <option value="4">4 (Cuádruple Mandala)</option>
                <option value="6" selected>6 (Gran Amplitud)</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Aciertos mínimos / Nivel:</label>
            <input type="number" id="hitsPerLevelInput" value="1" min="1" max="10" onchange="updateSettings()">
        </div>
        <div class="setting-group">
            <label>Fallos máximos (Penalización):</label>
            <input type="number" id="failsPerPenaltyInput" value="3" min="1" max="10" onchange="updateSettings()">
        </div>
        <div class="setting-group" id="modContainer" style="border-top: 1px dashed #00b4d8; padding-top: 8px; margin-top: 8px;">
            <label style="color: #00ffcc;">Modificadores Desbloqueables:</label><br>
            <label style="font-size:0.8rem; display:flex; align-items:center; gap:8px; margin-top:4px; cursor:pointer;">
                <input type="checkbox" id="modMirror" onchange="updateSettings()" disabled style="width:18px; height:18px;"> Espejo Inverso (🔒)
            </label>
            <label style="font-size:0.8rem; display:flex; align-items:center; gap:8px; margin-top:4px; cursor:pointer;">
                <input type="checkbox" id="modDoublePulse" onchange="updateSettings()" disabled style="width:18px; height:18px;"> Pulso Dual (🔒)
            </label>
        </div>
        <div class="setting-group">
            <label>Volumen FX / Música:</label>
            <div style="display:flex; gap:8px;">
                <input type="range" id="fxVolInput" min="0" max="1" step="0.1" value="0.3" onchange="updateSettings()">
                <input type="range" id="musicVolInput" min="0" max="1" step="0.1" value="0.5" onchange="updateSettings()">
            </div>
        </div>
        <div style="margin-top: 14px;">
            <button class="btn" style="background: rgba(0, 180, 216, 0.2); border-color: #00b4d8; color: #ffffff; max-width: 100%; margin-bottom: 8px;" onclick="resetAchievements()">RESETEAR LOGROS</button>
            <button class="btn active" style="max-width: 100%;" onclick="toggleModal('settingsModal')">CERRAR</button>
        </div>
    </div>

    <div id="achievementsModal" class="modal">
        <h2>LOGROS Y DESBLOQUEOS</h2>
        <div id="achievementsList" style="max-height: 240px; overflow-y: auto; margin-bottom: 12px; padding-right: 5px;"></div>
        <button class="btn active" style="max-width: 100%;" onclick="toggleModal('achievementsModal')">CERRAR</button>
    </div>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY</h1>
        <div class="stats-row" id="statsRow">Ptos: <span id="score">0</span> | Récord: <span id="highScore">0</span> | Nivel: <span id="level">1</span></div>
        <div class="info-row">Modo: <span id="modeLabel">Arcade</span> | Paleta: <span id="themeLabel">Aleatorio</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="controls-bar">
        <div class="button-row">
            <button id="pauseBtn" class="btn" onclick="togglePause()">PAUSA</button>
            <button id="modeBtn" class="btn" onclick="toggleGameMode()">MODO: ARCADE</button>
            <button class="btn" onclick="resetGame()">REINICIAR</button>
        </div>
        <div class="button-row">
            <button class="btn" onclick="toggleModal('settingsModal')">AJUSTES</button>
            <button class="btn" onclick="openAchievements()">LOGROS</button>
            <button id="musicBtn" class="btn active" onclick="toggleMusic()">MÚSICA</button>
        </div>
        <div class="button-row">
            <button class="btn" onclick="nextSongAndForm()">NEXT 🎵</button>
            <button id="relaxBtn" class="btn" onclick="toggleRelaxMode()">RELAX</button>
            <button id="themeBtn" class="btn" onclick="changeTheme()">PALETA: ALEATORIO</button>
        </div>
        <div class="button-row">
            <button id="speedBtn" class="btn" onclick="changeSpeed()">VEL: 1.0x</button>
            <button id="autoBtn" class="btn" onclick="toggleAutoMode()">AUTO: OFF</button>
            <button class="btn" style="background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #ffffff;" onclick="document.getElementById('localMusicInput').click()">LOCAL 📂</button>
            <input type="file" id="localMusicInput" multiple accept="audio/*" style="display: none;" onchange="loadLocalMusic(event)">
        </div>
    </div>
    
    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statsRow = document.getElementById('statsRow');
    const modeLabel = document.getElementById('modeLabel');
    const themeLabel = document.getElementById('themeLabel');
    const mainTitle = document.getElementById('mainTitle');
    const autoBtn = document.getElementById('autoBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const relaxBtn = document.getElementById('relaxBtn');
    const themeBtn = document.getElementById('themeBtn');
    const modeBtn = document.getElementById('modeBtn');
    const musicBtn = document.getElementById('musicBtn');
    const uiContainer = document.getElementById('ui');
    const controlsBar = document.getElementById('controls-bar');
    const floatingControls = document.getElementById('floatingControls');
    const achievementToast = document.getElementById('achievementToast');
    const trackToast = document.getElementById('trackToast');

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudioContext() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeepSound() {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(fxVolume * 0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
    }

    function playSuccessSound() {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(fxVolume * 0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        } catch(e) {}
    }

    function playFailSound() {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(fxVolume * 0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }

    function playTrackChangeSound() {
        if (!audioCtx) return;
        try {
            let now = audioCtx.currentTime;
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (i * 0.06));
                gain.gain.setValueAtTime(fxVolume * 0.12, now + (i * 0.06));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.06) + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + (i * 0.06));
                osc.stop(now + (i * 0.06) + 0.15);
            });
        } catch(e) {}
    }

    let score = 0;
    let highScore = localStorage.getItem('polarHighScorePro') || 0;
    document.getElementById('highScore').innerText = highScore;

    let level = 1;
    let successfulHits = 0;
    let consecutiveFails = 0;
    let perfectStreak = 0; 
    let themesExplored = 0;
    
    let requiredHitsForLevel = 1;
    let maxFailsForPenalty = 3;
    let fxVolume = 0.3;
    let musicVolume = 0.5;
    let curveVarietyMode = 'pretty'; 
    let layerCount = 6; 

    let musicMode = 1;
    let currentTrackIndex = 1;
    const totalTracks = 137;
    let mp3Player = new Audio();
    mp3Player.volume = musicVolume;

    let localPlaylist = [];
    let isUsingLocalMusic = false;
    let relaxVariant = 'curves';

    function updateRelaxVariant() {
        playBeepSound();
        relaxVariant = document.getElementById('relaxVariantSelect').value;
        generateNewForm();
    }

    function showTrackBanner(name) {
        trackToast.innerText = `🎵 ${name}`;
        trackToast.classList.add('show');
        setTimeout(() => trackToast.classList.remove('show'), 4500);
    }

    function loadLocalMusic(event) {
        const files = event.target.files;
        if (files.length > 0) {
            localPlaylist = [];
            for (let i = 0; i < files.length; i++) {
                localPlaylist.push({ url: URL.createObjectURL(files[i]), name: files[i].name });
            }
            isUsingLocalMusic = true;
            currentTrackIndex = 0;
            musicBtn.classList.add('active');
            musicBtn.innerText = musicMode === 1 ? `LOC: SEC` : `LOC: ALE`;
            playTrack();
        }
    }

    function playTrack() {
        playTrackChangeSound();
        if (isUsingLocalMusic) {
            if (localPlaylist.length === 0) return;
            if (musicMode === 2) {
                currentTrackIndex = Math.floor(Math.random() * localPlaylist.length);
            }
            let track = localPlaylist[currentTrackIndex];
            mp3Player.src = track.url;
            mp3Player.play().catch(e => console.log("Reproducción local pendiente", e));
            showTrackBanner(track.name);
            if (musicMode === 1) {
                currentTrackIndex = (currentTrackIndex + 1) % localPlaylist.length;
            }
        } else {
            if (musicMode === 0) return;
            if (musicMode === 1) {
                currentTrackIndex++;
                if (currentTrackIndex > totalTracks) currentTrackIndex = 1;
            } else if (musicMode === 2) {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * totalTracks) + 1;
                } while (newIndex === currentTrackIndex && totalTracks > 1);
                currentTrackIndex = newIndex;
            }
            let trackStr = String(currentTrackIndex).padStart(3, '0');
            mp3Player.src = `multimedia/${trackStr}.mp3`;
            mp3Player.play().catch(e => console.log("Reproducción pendiente", e));
            showTrackBanner(`Pista #${trackStr}.mp3`);
        }
    }

    mp3Player.addEventListener('ended', () => {
        if (musicMode > 0) playTrack();
    });

    function toggleMusic() {
        initAudioContext();
        musicMode = (musicMode + 1) % 3;
        let prefix = isUsingLocalMusic ? "LOC" : "MÚSICA";
        if (musicMode === 0) {
            musicBtn.classList.remove('active');
            musicBtn.innerText = `${prefix}: OFF`;
            mp3Player.pause();
        } else if (musicMode === 1) {
            musicBtn.classList.add('active');
            musicBtn.innerText = `${prefix}: SEC`;
            playTrack();
        } else {
            musicBtn.classList.add('active');
            musicBtn.innerText = `${prefix}: ALE`;
            playTrack();
        }
    }

    function nextSongAndForm() {
        initAudioContext();
        playTrack();
        generateNewForm();
        if (isRandomThemeMode) applyRandomTheme();
        resetTarget();
    }

    let autoMode = false;
    let isPaused = false;
    let relaxMode = false;
    let gameMode = 'arcade';
    let timeAttackSeconds = 60;
    let timeAttackTimer = null;
    let gameSpeed = 1.0;
    let angle = 0;
    
    // Variables para el Modo Electrón
    let electronAngle = 0;
    let electronCurve = { type: 'spiral', p1: 2, p2: 1, scale: 150 };
    let electronTrail = [];

    let activeCurves = [
        { type: 'rhodonea', p1: 5, p2: 6, p3: 2, scale: 280 },
        { type: 'lemniscate', p1: 4, p2: 3, p3: 1, scale: 240 },
        { type: 'star', p1: 3, p2: 2, p3: 1, scale: 195 },
        { type: 'trifolio', p1: 2, p2: 1, p3: 1, scale: 145 },
        { type: 'epicycloid', p1: 3, p2: 2, p3: 1, scale: 100 },
        { type: 'roseFrac', p1: 5, p2: 2, p3: 1, scale: 65 }
    ];

    let relaxTimer = 0;
    let screenShake = 0;
    let floatingTexts = [];

    let achievements = [
        { id: 'first_perfect', name: 'Primer Impacto', desc: 'Consigue tu primer acierto', unlocked: false },
        { id: 'streak_3', name: 'Racha de Bronce', desc: 'Consigue 3 aciertos seguidos', unlocked: false },
        { id: 'streak_7', name: 'Racha de Plata', desc: 'Consigue 7 aciertos seguidos', unlocked: false },
        { id: 'streak_15', name: 'Racha de Oro', desc: 'Consigue 15 aciertos seguidos', unlocked: false },
        { id: 'level_10', name: 'Explorador Polar', desc: 'Alcanza el nivel 10', unlocked: false },
        { id: 'level_25', name: 'Maestro Polar', desc: 'Alcanza el nivel 25 (Mod: Espejo)', unlocked: false, reward: 'mirror' },
        { id: 'level_50', name: 'Leyenda Viva', desc: 'Alcanza el nivel 50 (Mod: Pulso Dual)', unlocked: false, reward: 'doublePulse' },
        { id: 'score_1000', name: 'Fiebre Neón', desc: 'Supera los 1.000 puntos', unlocked: false },
        { id: 'score_5000', name: 'Dios del Neón', desc: 'Supera los 5.000 puntos', unlocked: false },
        { id: 'score_10000', name: 'Infinito', desc: 'Supera los 10.000 puntos', unlocked: false },
        { id: 'speed_demon', name: 'Velocidad Luz', desc: 'Juega a velocidad 3.0x', unlocked: false },
        { id: 'zen_mode', name: 'Modo Zen', desc: 'Activa el modo Relax', unlocked: false },
        { id: 'auto_pilot', name: 'Piloto', desc: 'Activa el modo Auto', unlocked: false },
        { id: 'palette_master', name: 'Coleccionista', desc: 'Explora 10 paletas distintas', unlocked: false },
        { id: 'survivor', name: 'Resiliencia', desc: 'Sobrevive a una penalización', unlocked: false },

    function initElectronMode() {
        const electronTypes = ['spiral', 'lemniscate', 'cardioid', 'rhodonea', 'lissajous', 'roseFrac'];
        let chosen = electronTypes[Math.floor(Math.random() * electronTypes.length)];
        electronCurve = {
            type: chosen,
            p1: Math.floor(Math.random() * 3) + 1,
            p2: Math.floor(Math.random() * 2) + 1,
            scale: 130 + Math.random() * 60
        };
        electronAngle = 0;
        electronTrail = [];
    }

    function getElectronPos(cx, cy) {
        let t = electronAngle;
        let tp1 = electronCurve.p1, tp2 = electronCurve.p2;
        let r = 100;
        switch(electronCurve.type) {
            case 'spiral':
                r = 40 + Math.abs(Math.sin(t * 0.2)) * 140;
                break;
            case 'lemniscate':
                r = electronCurve.scale * Math.sqrt(Math.abs(Math.cos(tp1 * t * 0.15)));
                break;
            case 'cardioid':
                r = electronCurve.scale * 0.6 * (1 + Math.cos(tp1 * t * 0.2));
                break;
            case 'rhodonea':
                r = electronCurve.scale * Math.cos((tp1 * t * 0.15) / tp2);
                break;
            case 'lissajous':
                r = electronCurve.scale * (0.4 + 0.6 * Math.sin(tp1 * t * 0.15) * Math.cos(tp2 * t * 0.15));
                break;
            case 'roseFrac':
                r = electronCurve.scale * Math.sin((tp1 * t * 0.15) / tp2);
                break;
            default:
                r = electronCurve.scale * Math.sin(tp1 * t * 0.15);
                break;
        }
        if (isNaN(r)) r = 100;
        let th = t * 0.4;
        return {
            x: cx + r * Math.cos(th),
            y: cy + r * Math.sin(th),
            radius: Math.abs(r)
        };
    }

    function generateNewForm() {
        const prettyCurves = [
            'rhodonea', 'roseFrac', 'piWave', 'grandisRose', 'trifolio', 'cuatrifolio',
            'cardioidLim', 'lemniscate', 'epicycloid', 'star', 'flower', 'octagram', 'decagram'
        ];
        
        const allCurves = [
            ...prettyCurves,
            'harmonic', 'lissajous', 'butterfly', 'spirograph', 'gear',
            'epitrochoid', 'hypotrochoid', 'cazoleta', 'logSpiral', 'cornu',
            'astroide', 'deltoide', 'hypocycloid', 'polyRose', 'nephroid',
            'limacon', 'parabolicHelix', 'superEllipse', 'sinusoidalGrid',
            'toroidalWave', 'hyperbolicSpiral', 'omegaSpiral'
        ];

        const pool = (curveVarietyMode === 'pretty') ? prettyCurves : allCurves;

        activeCurves = [];
        let baseScales = [280, 240, 195, 145, 100, 65]; 

        for (let i = 0; i < 6; i++) {
            let valid = false;
            let attempts = 0;
            let curveObj = {};

            while (!valid && attempts < 50) {
                attempts++;
                let cType = pool[Math.floor(Math.random() * pool.length)];
                if (i > 0 && activeCurves.some(c => c.type === cType)) continue;

                let maxParam = (i >= 2) ? 2 : 5;
                let minParam = 1;
                let tp1 = Math.floor(Math.random() * (maxParam - minParam + 1)) + minParam;
                let tp2 = Math.floor(Math.random() * 3) + 1;
                let tp3 = Math.floor(Math.random() * 2) + 1;

                if (testCurveQuality(cType, tp1, tp2)) {
                    curveObj = { type: cType, p1: tp1, p2: tp2, p3: tp3, scale: baseScales[i] };
                    valid = true;
                }
            }
            if (!valid) {
                curveObj = { type: 'trifolio', p1: 1, p2: 1, p3: 1, scale: baseScales[i] };
            }
            activeCurves.push(curveObj);
        }
    }

    function testCurveQuality(cType, tp1, tp2) {
        let maxVal = 0;
        let minVal = 9999;
        let testSteps = 80;
        for (let i = 0; i < testSteps; i++) {
            let th = (i / testSteps) * Math.PI * 16;
            let rawR = Math.abs(getRawPolarRadiusForTest(cType, tp1, tp2, th, 0));
            if (!isNaN(rawR) && rawR < 1000) {
                if (rawR > maxVal) maxVal = rawR;
                if (rawR < minVal) minVal = rawR;
            }
        }
        if (maxVal < 25) return false;
        if ((maxVal - minVal) < (maxVal * 0.25)) return false; 
        return true;
    }

    function getRawPolarRadiusForTest(cType, tp1, tp2, th, currentAngle) {
        let t = th + currentAngle;
        switch(cType) {
            case 'rhodonea': return Math.cos((tp1 * t) / tp2) * 100;
            case 'roseFrac': return Math.sin((tp1 * t) / tp2) * 100;
            case 'piWave': return Math.sin(tp1 * Math.PI * t / tp2) * 105;
            case 'grandisRose': return (Math.sin(tp1 * t / 3) * Math.cos(tp2 * t / 2)) * 100;
            case 'trifolio': return Math.sin(3 * t) * 100;
            case 'cuatrifolio': return Math.cos(2 * t) * 100;
            case 'cardioidLim': return (1 + 0.6 * Math.cos(tp1 * t)) * 95;
            case 'lemniscate': return Math.sqrt(Math.abs(Math.cos(tp1 * t))) * 110;
            case 'epicycloid': return (Math.sin(tp1 * t) * Math.cos(tp2 * th)) * 100;
            case 'star': return (1 - 0.35 * Math.abs(Math.sin(tp1 * t / 2))) * 105;
            case 'flower': return (0.5 + 0.5 * Math.cos(tp1 * t)) * 110;
            default: return Math.sin(tp1 * t) * 100;
        }
    }

    function calculatePolarRadiusForCurve(curve, th, currentAngle) {
        let t = th + currentAngle;
        let raw = 100;
        let tp1 = curve.p1, tp2 = curve.p2, tp3 = curve.p3;

        switch(curve.type) {
            case 'rhodonea': raw = Math.cos((tp1 * t) / tp2) * 100; break;
            case 'roseFrac': raw = Math.sin((tp1 * t) / tp2) * 100; break;
            case 'piWave': raw = Math.sin(tp1 * Math.PI * t / tp2) * 105; break;
            case 'grandisRose': raw = (Math.sin(tp1 * t / 3) * Math.cos(tp2 * t / 2)) * 100; break;
            case 'trifolio': raw = Math.sin(3 * t) * 100; break;
            case 'cuatrifolio': raw = Math.cos(2 * t) * 100; break;
            case 'cardioidLim': raw = (1 + 0.6 * Math.cos(tp1 * t)) * 95; break;
            case 'lemniscate': raw = Math.sqrt(Math.abs(Math.cos(tp1 * t))) * 110; break;
            case 'epicycloid': raw = (Math.sin(tp1 * t) * Math.cos(tp2 * th)) * 100; break;
            case 'star': raw = (1 - 0.35 * Math.abs(Math.sin(tp1 * t / 2))) * 105; break;
            case 'flower': raw = (0.5 + 0.5 * Math.cos(tp1 * t)) * 110; break;
            case 'octagram': raw = Math.cos(4 * t) * 105; break;
            case 'decagram': raw = Math.cos(5 * t) * 105; break;
            case 'harmonic': raw = (Math.sin(tp1 * t) + Math.cos(tp2 * th) / tp3) * 90; break;
            case 'lissajous': raw = Math.sin(tp1 * t) * Math.cos(tp2 * t) * 100; break;
            case 'butterfly': raw = (Math.exp(Math.cos(t)) - 2 * Math.cos(4*t)) * 45; break;
            case 'spirograph': raw = (0.8 * Math.cos(tp1 * t) + 0.3 * Math.cos(tp2 * t)) * 100; break;
            case 'gear': raw = (1 + 0.2 * Math.sin(tp1 * tp2 * t)) * 95; break;
            case 'epitrochoid': raw = (1.2 * Math.cos(tp1 * t) - 0.4 * Math.cos(tp2 * t)) * 90; break;
            case 'hypotrochoid': raw = (0.9 * Math.sin(tp1 * t) + 0.3 * Math.sin(tp3 * t)) * 95; break;
            case 'cazoleta': raw = (Math.sin(tp1 * t) * Math.sin(tp2 * t)) * 100; break;
            case 'logSpiral': raw = Math.exp(0.08 * Math.sin(t)) * 85; break;
            case 'cornu': raw = Math.sin(t * t * 0.08) * 95; break;
            case 'astroide': raw = Math.pow(Math.abs(Math.cos(t)), 3) * 105; break;
            case 'deltoide': raw = (2 * Math.cos(t) + Math.cos(2 * t)) * 65; break;
            case 'hypocycloid': raw = ((tp1-1)*Math.cos(t) + Math.cos((tp1-1)*t)) * 55; break;
            case 'polyRose': raw = (Math.sin(tp1 * t) * Math.sin(tp2 * t)) * 100; break;
            case 'nephroid': raw = (1 + 2 * Math.sin(t/2)) * 70; break;
            case 'limacon': raw = (0.5 + Math.cos(t)) * 95; break;
            case 'parabolicHelix': raw = Math.tan(t * 0.1) * 40; break;
            case 'superEllipse': raw = Math.pow(Math.abs(Math.cos(t)), 2/tp1) * 95; break;
            case 'sinusoidalGrid': raw = (Math.sin(tp1*t) + Math.sin(tp2*t)) * 90; break;
            case 'toroidalWave': raw = (Math.cos(tp1*t) * Math.sin(tp2*t)) * 95; break;
            case 'hyperbolicSpiral': raw = (65 / (t + 0.5)); break;
            case 'omegaSpiral': raw = (Math.sin(t) * Math.cos(t * 0.5)) * 95; break;
            default: raw = Math.sin(tp1 * t) * 100; break;
        }
        return curve.scale * (raw / 100);
    }


        function createExplosionParticles(x, y) {
        let count = perfectStreak >= 3 ? 25 : 15;
        for (let i = 0; i < count; i++) {
            let pAngle = Math.random() * Math.PI * 2;
            let pSpeed = Math.random() * 3.5 + 1;
            particles.push({ 
                x: x, 
                y: y, 
                vx: Math.cos(pAngle) * pSpeed, 
                vy: Math.sin(pAngle) * pSpeed, 
                life: 1.0, 
                color: theme.target,
                size: Math.random() * 2 + 2
            });
        }
    }

    function checkAction() {
        if (isPaused || relaxMode) return;
        initAudioContext();
        playBeepSound();
        
        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        let isHit = false;

        if (gameMode === 'electron') {
            let elPos = getElectronPos(cx, cy);
            let distToTarget = Math.hypot(elPos.x - tx, elPos.y - ty);
            isHit = (distToTarget < 35);
        } else {
            let tx2 = cx + target2.radius * Math.cos(target2.angle);
            let diff = Math.abs(pulseRadius - target.radius);
            let diffTarget2 = (gameMode === 'dualorb') ? Math.abs(pulseRadius - target2.radius) : 999;
            let doublePulseEl = document.getElementById('modDoublePulse');
            let diff2 = (doublePulseEl && doublePulseEl.checked) ? Math.abs(pulseRadius2 - target.radius) : 999;
            let tolerance = 25;
            isHit = (diff < tolerance || diffTarget2 < tolerance || diff2 < tolerance);
        }

        if (isHit) {
            playSuccessSound();
            consecutiveFails = 0;
            successfulHits++;
            perfectStreak++;
            
            unlockAchievement('first_perfect');
            if (perfectStreak >= 3) unlockAchievement('streak_3');
            if (perfectStreak >= 5) unlockAchievement('mono_pink');
            if (perfectStreak >= 7) unlockAchievement('streak_7');
            if (perfectStreak >= 10) unlockAchievement('theme_dual_retro');
            if (perfectStreak >= 12) unlockAchievement('theme_rosa');
            if (perfectStreak >= 15) unlockAchievement('streak_15');

            if (score >= 500) unlockAchievement('mono_emerald');
            if (score >= 800) unlockAchievement('mono_violet');
            if (score >= 1200) unlockAchievement('mono_night');
            if (score >= 1500) unlockAchievement('theme_spectrum');
            if (score >= 2500) {
                unlockAchievement('mode_survive');
                unlockAchievement('theme_cpc');
            }
            if (score >= 3500) unlockAchievement('mono_gold');
            if (score >= 4000) unlockAchievement('theme_celeste');
            if (score >= 4500) unlockAchievement('mono_turq');

            if (perfectStreak > 1) {
                floatingTexts.push({ x: cx, y: cy - 30, text: `COMBO x${perfectStreak}!`, life: 1.0, color: theme.strokes[0] });
            }

            if (gameMode !== 'infinite') {
                let ghostBonus = (gameMode === 'ghost' || gameMode === 'extreme') ? 50 : 0;
                score += 100 + ghostBonus + (level * (gameMode === 'timeAttack' ? 25 : 10)) + (perfectStreak * 10);
                if (gameMode === 'timeAttack') timeAttackSeconds += 5; // +5 segundos por acierto
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('polarHighScorePro', highScore);
                    if (highScore >= 1000) unlockAchievement('score_1000');
                    if (highScore >= 5000) unlockAchievement('score_5000');
                    if (highScore >= 10000) unlockAchievement('score_10000');
                }
            }

            feedbackText = "¡PERFECTO!";
            feedbackColor = theme.strokes[0];
            screenFlash = 0.25;
            createExplosionParticles(tx, ty);

            if (successfulHits >= requiredHitsForLevel) {
                level++;
                successfulHits = 0;
                if (isRandomThemeMode) applyRandomTheme();
                if (level >= 5) unlockAchievement('mono_blood');
                if (level >= 7) unlockAchievement('mono_amber');
                if (level >= 8) unlockAchievement('mode_blind');
                if (level >= 10) unlockAchievement('level_10');
                if (level >= 12) unlockAchievement('mode_extreme');
                if (level >= 14) unlockAchievement('mono_lime');
                if (level >= 15) unlockAchievement('theme_tri_retro');
                if (level >= 16) unlockAchievement('mono_tech');
                if (level >= 18) unlockAchievement('theme_ambar');
                if (level >= 20) unlockAchievement('mode_dualorb');
                if (level >= 22) unlockAchievement('theme_cian');
                if (level >= 25) unlockAchievement('level_25');
                if (level >= 50) unlockAchievement('level_50');
            }

            generateNewForm();
            resetTarget();
        } else {
            playFailSound();
            consecutiveFails++;
            perfectStreak = 0;
            screenShake = 6;

            if (gameMode === 'timeAttack') {
                timeAttackSeconds = Math.max(0, timeAttackSeconds - 8); // -8 segundos por fallo
            }

            if (gameMode === 'survival') {
                score = 0;
                level = 1;
                feedbackText = "¡SUPERVIVENCIA ROTA!";
            } else if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                successfulHits = 0;
                if (gameMode === 'infinite' || gameMode === 'arcade' || gameMode === 'ghost' || gameMode === 'blind' || gameMode === 'electron') {
                    if (level > 1) unlockAchievement('survivor');
                    level = Math.max(1, level - 1);
                    feedbackText = "¡BAJAS NIVEL!";
                } else {
                    score = 0;
                    feedbackText = "¡PUNTOS A CERO!";
                }
            } else {
                if (gameMode !== 'infinite') score = Math.max(0, score - 15);
                feedbackText = "¡FALLO!";
            }
            feedbackColor = "#ffaa00";
        }
        
        updateDOMStats();
        feedbackTimer = 35;
        }

    function update() {
        if (isPaused) return;
        if (screenShake > 0) screenShake *= 0.85;

        if (relaxMode) {
            relaxTimer++;
            if (relaxTimer > 250) {
                relaxTimer = 0;
                generateNewForm();
                if(isRandomThemeMode) applyRandomTheme();
            }
        }

        let mirrorEl = document.getElementById('modMirror');
        let mirrorMod = (mirrorEl && mirrorEl.checked) ? -1 : 1;
        if (gameMode === 'extreme') mirrorMod *= (Math.sin(angle * 5) > 0 ? 1.5 : -1.5);

        target.angle += target.speed * gameSpeed * mirrorMod;
        target2.angle += target2.speed * gameSpeed * mirrorMod;

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        
        if (gameMode === 'electron') {
            electronAngle += 0.04 * gameSpeed * mirrorMod;
            let elPos = getElectronPos(cx, cy);
            electronTrail.push({ x: elPos.x, y: elPos.y, life: 1.0 });
            if (electronTrail.length > 25) electronTrail.shift();
            for (let et of electronTrail) et.life -= 0.04;
        }

        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        let isGhostInvisible = ((gameMode === 'ghost' || gameMode === 'extreme') && pulseRadius > 80) || (gameMode === 'blind');
        
        if (!isGhostInvisible) {
            targetParticles.push({ x: tx, y: ty, life: 1.0 });
        }

        for (let i = targetParticles.length - 1; i >= 0; i--) {
            targetParticles[i].life -= 0.1;
            if (targetParticles[i].life <= 0) targetParticles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].y -= 0.8;
            floatingTexts[i].life -= 0.02;
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }

        if (gameMode !== 'electron') {
            pulseRadius += (1.2 + (level * 0.05)) * gameSpeed;
            let doublePulseEl = document.getElementById('modDoublePulse');
            if (doublePulseEl && doublePulseEl.checked) {
                pulseRadius2 += (1.2 + (level * 0.05)) * gameSpeed;
            }

            if (pulseRadius > 230) {
                consecutiveFails++;
                perfectStreak = 0;
                if (consecutiveFails >= maxFailsForPenalty) {
                    consecutiveFails = 0;
                    if (level > 1) unlockAchievement('survivor');
                    if (gameMode === 'infinite') level = Math.max(1, level - 1);
                    else score = 0;
                    updateDOMStats();
                }
                resetTarget();
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.03;
            if (p.life <= 0) particles.splice(i, 1);
        }

        angle += 0.003 * gameSpeed * mirrorMod;
        let doublePulseEl = document.getElementById('modDoublePulse');
        let dPulseActive = doublePulseEl && doublePulseEl.checked;
        if (autoMode) {
            if (gameMode === 'electron') {
                let elPos = getElectronPos(cx, cy);
                if (Math.hypot(elPos.x - tx, elPos.y - ty) < 20) checkAction();
            } else if (Math.abs(pulseRadius - target.radius) < 2 || (dPulseActive && Math.abs(pulseRadius2 - target.radius) < 2)) {
                checkAction();
            }
        }
    }

    function drawRetroBackground(cx, cy) {
        ctx.strokeStyle = theme.wave;
        ctx.globalAlpha = 0.06;
        ctx.lineWidth = 1;
        let gridOffset = (angle * 20) % 20;
        for (let y = cy; y < canvas.height; y += 12) {
            ctx.beginPath();
            ctx.moveTo(0, y + gridOffset);
            ctx.lineTo(canvas.width, y + gridOffset);
            ctx.stroke();
        }
        for (let x = -canvas.width; x < canvas.width * 2; x += 35) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
    }

    function draw() {
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        ctx.fillStyle = theme.bg;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;

        if (screenFlash > 0) {
            ctx.fillStyle = theme.strokes[0];
            ctx.globalAlpha = screenFlash;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            screenFlash -= 0.04;
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        drawRetroBackground(cx, cy);

        ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        let opacities = [1.0, 0.85, 0.7, 0.55, 0.4, 0.25];
        let rotations = [angle, -angle * 1.2, angle * 0.7 + Math.PI / 4, -angle * 0.4, angle * 1.5, -angle * 0.9];

        let showCurves = (relaxVariant === 'curves' || relaxVariant === 'combined' || !relaxMode);
        let showPetals = (relaxVariant === 'petals' || relaxVariant === 'combined');

        if (showCurves) {
            for (let l = 0; l < Math.min(layerCount, activeCurves.length); l++) {
                let curve = activeCurves[l];
                ctx.beginPath();
                ctx.strokeStyle = theme.strokes[l % theme.strokes.length];
                ctx.lineWidth = (l === 0) ? 2.5 : 1.8;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = (l === 0) ? 10 : 4;
                ctx.globalAlpha = opacities[l];
                
                let maxTheta = Math.PI * 16;
                for (let th = 0; th < maxTheta; th += 0.01) {
                    let r = calculatePolarRadiusForCurve(curve, th, rotations[l]);
                    let x = cx + r * Math.cos(th);
                    let y = cy + r * Math.sin(th);
                    if (th === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        if (showPetals) {
            let petalCount = 8;
            for (let p = 0; p < 3; p++) {
                ctx.beginPath();
                ctx.strokeStyle = theme.strokes[(p + 1) % theme.strokes.length];
                ctx.lineWidth = 2.0;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 8;
                ctx.globalAlpha = 0.7;

                let maxTheta = Math.PI * 2;
                for (let th = 0; th < maxTheta; th += 0.01) {
                    let r = (120 + p * 25) * Math.cos(petalCount * (th + angle * (p % 2 === 0 ? 1 : -1)));
                    let x = cx + r * Math.cos(th);
                    let y = cy + r * Math.sin(th);
                    if (th === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;

        for (let tp of targetParticles) {
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.globalAlpha = tp.life * 0.4;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        let isGhostInvisible = ((gameMode === 'ghost' || gameMode === 'extreme') && pulseRadius > 80) || (gameMode === 'blind');
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        if (!relaxMode && !isGhostInvisible) {
            ctx.beginPath();
            ctx.arc(tx, ty, 8, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.shadowColor = theme.target;
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        if (gameMode === 'dualorb' && !relaxMode) {
            let tx2 = cx + target2.radius * Math.cos(target2.angle);
            let ty2 = cy + target2.radius * Math.sin(target2.angle);
            ctx.beginPath();
            ctx.arc(tx2, ty2, 8, 0, Math.PI * 2);
            ctx.fillStyle = theme.strokes[1] || '#ffffff';
            ctx.fill();
        }

        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        // Renderizado especial para el Modo Electrón (Estela y Partícula Electrón)
        if (gameMode === 'electron' && !relaxMode) {
            for (let et of electronTrail) {
                ctx.beginPath();
                ctx.arc(et.x, et.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = theme.wave;
                ctx.globalAlpha = et.life * 0.6;
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            let elPos = getElectronPos(cx, cy);
            ctx.beginPath();
            ctx.arc(elPos.x, elPos.y, 9, 0, Math.PI * 2);
            ctx.fillStyle = theme.wave;
            ctx.shadowColor = theme.wave;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        } else if (!relaxMode) {
            ctx.beginPath();
            ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
            ctx.strokeStyle = theme.wave;
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        let doublePulseEl = document.getElementById('modDoublePulse');
        if (doublePulseEl && doublePulseEl.checked && pulseRadius2 > 0 && !relaxMode && gameMode !== 'electron') {
            ctx.beginPath();
            ctx.arc(cx, cy, pulseRadius2, 0, Math.PI * 2);
            ctx.strokeStyle = theme.target;
            ctx.lineWidth = 2.0;
            ctx.stroke();
        }

        for (let ft of floatingTexts) {
            ctx.font = 'bold 15px monospace';
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = ft.life;
            ctx.textAlign = 'center';
            ctx.shadowColor = ft.color;
            ctx.shadowBlur = 8;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        if (isPaused) {
            ctx.font = 'bold 22px monospace';
            ctx.fillStyle = theme.target;
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (!relaxMode && feedbackTimer > 0) {
            ctx.font = 'bold 18px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy + 40);
            feedbackTimer--;
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    applyRandomTheme();
    generateNewForm();
    resetTarget();
    loop();

    playTrack();
    
    window.addEventListener('pointerdown', () => {
        initAudioContext();
        if (musicMode > 0 && mp3Player.paused) {
            playTrack();
        }
    }, { once: true });
</script>
</body>
</html>
