<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Single Node & Pause</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #05070d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.5s ease;
        }
        #ui {
            margin-top: 10px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; color: #ff007f; transition: color 0.5s ease; }
        p { margin: 3px 0 0 0; font-size: 0.8rem; color: #8ab4f8; }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }
        
        canvas {
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
            background: #080c16;
            border-radius: 50%;
            width: 82vw;
            height: 82vw;
            max-width: 390px;
            max-height: 390px;
            transition: box-shadow 0.5s ease;
        }

        #controls-bar {
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        .btn {
            background: rgba(0, 255, 204, 0.15);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
        }

        .btn.active {
            background: #ff007f;
            border-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 15px #ff007f;
        }

        #instructions {
            margin-bottom: 10px;
            font-size: 0.65rem;
            color: #5f6368;
            text-align: center;
            padding: 0 15px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY</h1>
        <p>Puntos: <span id="score">0</span> | Nivel: <span id="level">1</span></p>
        <p style="font-size: 0.75rem; color: #ff00aa;">Forma: <span id="formName">Armónica</span></p>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="controls-bar">
        <button id="pauseBtn" class="btn" onclick="togglePause()">PAUSA</button>
        <button id="autoBtn" class="btn" onclick="toggleAutoMode()">AUTO: OFF</button>
    </div>
    
    <div id="instructions">Toca la pantalla cuando el anillo coincida con el punto brillante</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const formNameEl = document.getElementById('formName');
    const mainTitle = document.getElementById('mainTitle');
    const autoBtn = document.getElementById('autoBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let score = 0;
    let level = 1;
    let fails = 0;
    let autoMode = false;
    let isPaused = false;
    let angle = 0;
    
    let num = 4;
    let den = 5;
    let curveType = 'fraction';

    const neonPalettes = [
        { stroke: '#ff007f', target: '#00ffcc', wave: 'rgba(0, 255, 204, 0.7)', title: '#ff007f', glow: 'rgba(255, 0, 127, 0.3)' },
        { stroke: '#00ffcc', target: '#ff00aa', wave: 'rgba(255, 0, 170, 0.7)', title: '#00ffcc', glow: 'rgba(0, 255, 204, 0.3)' },
        { stroke: '#adff2f', target: '#00ccff', wave: 'rgba(0, 204, 255, 0.7)', title: '#adff2f', glow: 'rgba(173, 255, 47, 0.3)' },
        { stroke: '#ff5500', target: '#7f00ff', wave: 'rgba(127, 0, 255, 0.7)', title: '#ff5500', glow: 'rgba(255, 85, 0, 0.3)' },
        { stroke: '#ffff00', target: '#ff0055', wave: 'rgba(255, 0, 85, 0.7)', title: '#ffff00', glow: 'rgba(255, 255, 0, 0.3)' },
        { stroke: '#00ffff', target: '#ff3300', wave: 'rgba(255, 51, 0, 0.7)', title: '#00ffff', glow: 'rgba(0, 255, 255, 0.3)' }
    ];

    let currentPalette = neonPalettes[0];

    let pulseRadius = 0;
    let feedbackTimer = 0;
    let feedbackText = '';
    let feedbackColor = '#00ffcc';

    // Un único punto objetivo dinámico que además orbita suavemente
    let target = {
        angle: Math.random() * Math.PI * 2,
        radius: 110,
        speed: 0.005
    };

    function resetTarget() {
        target.angle = Math.random() * Math.PI * 2;
        target.radius = 70 + Math.random() * 90;
        target.speed = (Math.random() > 0.5 ? 1 : -1) * (0.003 + level * 0.001); // Se mueve más rápido en niveles altos
        pulseRadius = 0;
    }

    // --- MÚSICA PROCEDURAL Y AUDIO (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
            startProceduralMusic();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSynthTone(freq, type = 'sine', duration = 0.3) {
        try {
            if (!audioCtx || isPaused) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    const backgroundScale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63];
    function startProceduralMusic() {
        if (musicInterval) return;
        musicInterval = setInterval(() => {
            if (!audioCtx || audioCtx.state !== 'running' || isPaused) return;
            let note1 = backgroundScale[Math.floor(Math.random() * backgroundScale.length)];
            let note2 = backgroundScale[Math.floor(Math.random() * backgroundScale.length)];
            playSynthTone(note1, 'sine', 2.2);
            setTimeout(() => playSynthTone(note2 * 1.5, 'triangle', 1.5), 1000);
        }, 3500);
    }

    const synthNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 659.25, 783.99];
    function getRandomNote() {
        return synthNotes[Math.floor(Math.random() * synthNotes.length)];
    }
    // -----------------------------------------------------------------

    function generateNewForm() {
        const types = ['fraction', 'pi', 'multi', 'rose'];
        curveType = types[Math.floor(Math.random() * types.length)];

        if (curveType === 'fraction') {
            num = Math.floor(Math.random() * 6) + 1;
            den = Math.floor(Math.random() * 5) + 2;
            formNameEl.innerText = `${num}θ / ${den}`;
        } else if (curveType === 'pi') {
            num = (Math.random() * 2 + 0.8).toFixed(1);
            formNameEl.innerText = `${num}πθ (Mandala)`;
        } else if (curveType === 'multi') {
            num = Math.floor(Math.random() * 5) + 2;
            den = Math.floor(Math.random() * 3) + 1;
            formNameEl.innerText = `Armónica ${num}:${den}`;
        } else {
            num = Math.floor(Math.random() * 7) + 2;
            formNameEl.innerText = `Rosa (${num} pétalos)`;
        }

        let randomPaletteIndex = Math.floor(Math.random() * neonPalettes.length);
        currentPalette = neonPalettes[randomPaletteIndex];
        mainTitle.style.color = currentPalette.title;
        canvas.style.boxShadow = `0 0 35px ${currentPalette.glow}`;
    }

    function toggleAutoMode() {
        initAudio();
        autoMode = !autoMode;
        if (autoMode) {
            autoBtn.classList.add('active');
            autoBtn.innerText = "AUTO: ON";
        } else {
            autoBtn.classList.remove('active');
            autoBtn.innerText = "AUTO: OFF";
        }
    }

    function togglePause() {
        initAudio();
        isPaused = !isPaused;
        if (isPaused) {
            pauseBtn.classList.add('active');
            pauseBtn.innerText = "REANUDAR";
        } else {
            pauseBtn.classList.remove('active');
            pauseBtn.innerText = "PAUSA";
        }
    }

    function checkAction() {
        if (isPaused) return;
        initAudio();
        playSynthTone(getRandomNote(), 'triangle', 0.2);

        let diff = Math.abs(pulseRadius - target.radius);
        
        // Margen de acierto ligeramente más exigente en niveles altos (infinito)
        let tolerance = Math.max(20, 32 - level * 1.5);

        if (diff < tolerance) {
            score += 100;
            fails = 0;
            feedbackText = "¡PERFECTO!";
            feedbackColor = currentPalette.stroke;
            playSynthTone(783.99, 'sine', 0.4); 

            // Subir nivel cada 5 aciertos
            if (score % 500 === 0) {
                level++;
                levelEl.innerText = level;
            }

            generateNewForm();
            resetTarget();
        } else {
            fails++;
            if (fails >= 5 && level > 1) {
                level--; // Retrocedes un nivel tras 5 fallos
                levelEl.innerText = level;
                fails = 0;
            }
            score = Math.max(0, score - 15);
            feedbackText = "¡FALLO!";
            feedbackColor = "#ff0055";
            playSynthTone(130.81, 'sawtooth', 0.2);
        }
        feedbackTimer = 25;
        scoreEl.innerText = score;
    }

    function updateAutoMode() {
        if (!autoMode || isPaused) return;
        if (Math.abs(pulseRadius - target.radius) < 2) {
            checkAction();
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        if (!autoMode && !isPaused) checkAction();
    }, false);

    function update() {
        if (isPaused) return;

        // El punto objetivo orbita lentamente alrededor del centro
        target.angle += target.speed;

        // Velocidad de la onda expansiva aumenta ligeramente con el nivel
        let pulseSpeed = 1.6 + (level - 1) * 0.15;
        pulseRadius += pulseSpeed;

        if (pulseRadius > 200) {
            if (!autoMode) {
                fails++;
                if (fails >= 5 && level > 1) {
                    level--;
                    levelEl.innerText = level;
                    fails = 0;
                }
            }
            resetTarget(); // Reinicia la onda y cambia la posición del punto
        }
        angle += 0.004;
        updateAutoMode();
    }

    function draw() {
        ctx.fillStyle = 'rgba(5, 7, 13, 0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 180; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Trazado de la figura geométrica polar
        ctx.beginPath();
        ctx.strokeStyle = currentPalette.stroke;
        ctx.lineWidth = 2.4;
        ctx.shadowColor = currentPalette.stroke;
        ctx.shadowBlur = 12;
        
        let scale = 85;
        let maxTheta = Math.PI * 20; 
        
        for (let th = 0; th < maxTheta; th += 0.005) {
            let r = 0;
            if (curveType === 'fraction') {
                r = scale * Math.sin((num * (th + angle)) / den);
            } else if (curveType === 'pi') {
                r = scale * Math.sin(num * (th + angle));
            } else if (curveType === 'multi') {
                r = scale * (Math.sin(num * (th + angle)) + Math.cos(den * th));
            } else {
                r = scale * Math.cos(num * (th + angle));
            }

            let x = cx + r * Math.cos(th);
            let y = cy + r * Math.sin(th);
            if (th === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Dibujar el ÚNICO punto objetivo en movimiento orbital
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        ctx.beginPath();
        ctx.arc(tx, ty, 9, 0, Math.PI * 2);
        ctx.fillStyle = currentPalette.target;
        ctx.shadowColor = currentPalette.target;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Onda expansiva principal
        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = currentPalette.wave;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Texto de pausa en pantalla si está pausado
        if (isPaused) {
            ctx.font = 'bold 26px monospace';
            ctx.fillStyle = '#00ffcc';
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (feedbackTimer > 0) {
            ctx.font = 'bold 20px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy - 40);
            feedbackTimer--;
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    generateNewForm();
    resetTarget();
    loop();
</script>

</body>
</html>
