<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Neon Palettes</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #05070d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.5s ease;
        }
        #ui {
            margin-top: 15px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: #ff007f; transition: color 0.5s ease; }
        p { margin: 4px 0 0 0; font-size: 0.85rem; color: #8ab4f8; }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        
        canvas {
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
            background: #080c16;
            border-radius: 50%;
            width: 86vw;
            height: 86vw;
            max-width: 410px;
            max-height: 410px;
            transition: box-shadow 0.5s ease;
        }
        #instructions {
            margin-bottom: 20px;
            font-size: 0.7rem;
            color: #5f6368;
            text-align: center;
            padding: 0 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY</h1>
        <p>Puntos: <span id="score">0</span> | Forma: <span id="formName">Armónica</span></p>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>
    
    <div id="instructions">Toca la pantalla cuando el anillo coincida con el nodo brillante</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const formNameEl = document.getElementById('formName');
    const mainTitle = document.getElementById('mainTitle');

    let score = 0;
    let angle = 0;
    
    let num = 4;
    let den = 5;
    let curveType = 'fraction';

    // Paleta variada de colores de neón vivos
    const neonPalettes = [
        { stroke: '#ff007f', target: '#00ffcc', wave: 'rgba(0, 255, 204, 0.7)', title: '#ff007f', glow: 'rgba(255, 0, 127, 0.3)' },
        { stroke: '#00ffcc', target: '#ff00aa', wave: 'rgba(255, 0, 170, 0.7)', title: '#00ffcc', glow: 'rgba(0, 255, 204, 0.3)' },
        { stroke: '#adff2f', target: '#00ccff', wave: 'rgba(0, 204, 255, 0.7)', title: '#adff2f', glow: 'rgba(173, 255, 47, 0.3)' },
        { stroke: '#ff5500', target: '#7f00ff', wave: 'rgba(127, 0, 255, 0.7)', title: '#ff5500', glow: 'rgba(255, 85, 0, 0.3)' },
        { stroke: '#ffff00', target: '#ff0055', wave: 'rgba(255, 0, 85, 0.7)', title: '#ffff00', glow: 'rgba(255, 255, 0, 0.3)' },
        { stroke: '#00ffff', target: '#ff3300', wave: 'rgba(255, 51, 0, 0.7)', title: '#00ffff', glow: 'rgba(0, 255, 255, 0.3)' }
    ];

    let currentPalette = neonPalettes[0];

    let pulseRadius = 0;
    let targetRadius = 120;
    let feedbackTimer = 0;
    let feedbackText = '';
    let feedbackColor = '#00ffcc';
    let targetAngle = Math.random() * Math.PI * 2;

    // Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSynthTone(freq, type = 'sine', duration = 0.3) {
        try {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    const synthNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 659.25];
    function getRandomNote() {
        return synthNotes[Math.floor(Math.random() * synthNotes.length)];
    }

    function generateNewForm() {
        const types = ['fraction', 'pi', 'multi', 'rose'];
        curveType = types[Math.floor(Math.random() * types.length)];

        if (curveType === 'fraction') {
            num = Math.floor(Math.random() * 6) + 1;
            den = Math.floor(Math.random() * 5) + 2;
            formNameEl.innerText = `${num}θ / ${den}`;
        } else if (curveType === 'pi') {
            num = (Math.random() * 2 + 0.5).toFixed(1);
            formNameEl.innerText = `${num}πθ`;
        } else if (curveType === 'multi') {
            num = Math.floor(Math.random() * 5) + 2;
            den = Math.floor(Math.random() * 3) + 1;
            formNameEl.innerText = `Armónica ${num}:${den}`;
        } else {
            num = Math.floor(Math.random() * 7) + 2;
            formNameEl.innerText = `Rosa (${num} pétalos)`;
        }

        // Cambiar a una paleta de colores completamente nueva al azar
        let randomPaletteIndex;
        do {
            randomPaletteIndex = Math.floor(Math.random() * neonPalettes.length);
        } while (neonPalettes[randomPaletteIndex] === currentPalette);

        currentPalette = neonPalettes[randomPaletteIndex];
        mainTitle.style.color = currentPalette.title;
        canvas.style.boxShadow = `0 0 35px ${currentPalette.glow}`;
    }

    function resetTarget() {
        targetAngle = Math.random() * Math.PI * 2;
        targetRadius = 70 + Math.random() * 90;
        pulseRadius = 0;
    }

    function triggerAction(e) {
        if (e) e.stopPropagation();
        
        playSynthTone(getRandomNote(), 'triangle', 0.2);

        let diff = Math.abs(pulseRadius - targetRadius);
        
        if (diff < 35) {
            score += 100;
            feedbackText = "¡PERFECTO!";
            feedbackColor = currentPalette.stroke;
            playSynthTone(783.99, 'sine', 0.4); 
            generateNewForm();
            resetTarget();
        } else {
            score = Math.max(0, score - 15);
            feedbackText = "¡FALLO!";
            feedbackColor = "#ff0055";
            playSynthTone(130.81, 'sawtooth', 0.2);
        }
        feedbackTimer = 25;
        scoreEl.innerText = score;
    }

    window.addEventListener('pointerdown', triggerAction, false);

    function update() {
        pulseRadius += 1.6;
        if (pulseRadius > 200) {
            pulseRadius = 0; 
        }
        angle += 0.005;
    }

    function draw() {
        // Fondo dinámico profundo con un sutil reflejo de la paleta actual
        ctx.fillStyle = 'rgba(5, 7, 13, 0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 180; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Trazado de la figura geométrica polar con el color de la paleta actual
        ctx.beginPath();
        ctx.strokeStyle = currentPalette.stroke;
        ctx.lineWidth = 2.4;
        ctx.shadowColor = currentPalette.stroke;
        ctx.shadowBlur = 12;
        
        let scale = 90;
        let maxTheta = Math.PI * 20; 
        
        for (let th = 0; th < maxTheta; th += 0.005) {
            let r = 0;
            if (curveType === 'fraction') {
                r = scale * Math.sin((num * (th + angle)) / den);
            } else if (curveType === 'pi') {
                r = scale * Math.sin(num * (th + angle));
            } else if (curveType === 'multi') {
                r = scale * (Math.sin(num * (th + angle)) + Math.cos(den * th));
            } else {
                r = scale * Math.cos(num * (th + angle));
            }

            let x = cx + r * Math.cos(th);
            let y = cy + r * Math.sin(th);
            if (th === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset sombra

        // Nodo objetivo con su color correspondiente
        let tx = cx + targetRadius * Math.cos(targetAngle);
        let ty = cy + targetRadius * Math.sin(targetAngle);
        
        ctx.beginPath();
        ctx.arc(tx, ty, 9, 0, Math.PI * 2);
        ctx.fillStyle = currentPalette.target;
        ctx.shadowColor = currentPalette.target;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Onda expansiva con tinte variable de la paleta
        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = currentPalette.wave;
        ctx.lineWidth = 2.2;
        ctx.stroke();

        if (feedbackTimer > 0) {
            ctx.font = 'bold 22px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy - 45);
            feedbackTimer--;
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    generateNewForm();
    loop();
</script>

</body>
</html>
