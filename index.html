<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Pro Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #05070d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            padding: 5px;
        }
        #ui {
            margin-top: 4px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            z-index: 10;
            width: 100%;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; color: #ff007f; }
        .stats-row { margin: 4px 0; font-size: 0.95rem; color: #ffffff; font-weight: bold; }
        .info-row { margin: 3px 0; font-size: 0.85rem; color: #ff00aa; font-weight: bold; }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            min-height: 0;
        }
        
        canvas {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.25);
            background: #080c16;
            border-radius: 50%;
            width: 70vh;
            height: 70vh;
            max-width: 340px;
            max-height: 340px;
        }

        #controls-bar {
            margin-bottom: 5px;
            display: flex;
            gap: 4px;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background: rgba(0, 255, 204, 0.15);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 7px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.55rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
        }

        .btn.active {
            background: #ff007f;
            border-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 10px #ff007f;
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 12, 22, 0.95);
            border: 2px solid #00ffcc;
            padding: 20px;
            border-radius: 15px;
            z-index: 200;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            display: none;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }
        .modal h2 { margin-top: 0; color: #00ffcc; font-size: 1.1rem; text-shadow: 0 0 8px rgba(0,255,204,0.6); }
        .setting-group { margin: 10px 0; font-size: 0.75rem; color: #ff00aa; font-weight: bold; }
        .setting-group input, .setting-group select { width: 140px; background: #05070d; border: 1px solid #00ffcc; color: #00ffcc; text-align: center; font-family: inherit; padding: 4px; border-radius: 5px; }

        #achievementToast {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 204, 0.9);
            color: #05070d;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 0 15px #00ffcc;
            z-index: 300;
            transition: top 0.4s ease;
            pointer-events: none;
            text-align: center;
        }
        #achievementToast.show { top: 15px; }

        #floatingControls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            gap: 8px;
            z-index: 100;
        }

        .floating-btn {
            background: rgba(0, 255, 204, 0.2);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
            text-shadow: 0 0 6px #00ffcc;
        }
        .floating-btn:hover {
            background: rgba(0, 255, 204, 0.4);
        }

        @media (orientation: landscape) {
            body {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                align-items: center;
                padding: 10px;
            }
            #ui { width: 45%; text-align: left; padding-left: 15px; }
            h1 { font-size: 1.2rem; }
            .canvas-container { width: 50%; height: 100vh; }
            canvas { width: 78dvh; height: 78dvh; max-width: 290px; max-height: 290px; }
            #controls-bar { width: 45%; flex-direction: column; align-items: stretch; gap: 4px; }
            .btn { font-size: 0.65rem; padding: 5px; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="floatingControls">
        <button class="floating-btn" onclick="nextSongAndForm()">NEXT 🎵</button>
        <button class="floating-btn" onclick="toggleRelaxMode()">SALIR</button>
    </div>
    <div id="achievementToast">🏆 ¡Logro Desbloqueado!</div>

        <button class="btn active" onclick="toggleModal('achievementsModal')">CERRAR</button>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY</h1>
        <div class="stats-row" id="statsRow">Ptos: <span id="score">0</span> | Récord: <span id="highScore">0</span> | Nivel: <span id="level">1</span></div>
        <div class="info-row">Modo: <span id="modeLabel">Arcade</span> | Paleta: <span id="themeLabel">Aleatorio</span></div>

        <button class="btn" onclick="toggleModal('settingsModal')">AJUSTES</button>

        <button id="autoBtn" class="btn" onclick="toggleAutoMode()">AUTO: OFF</button>

    <script>

    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const relaxBtn = document.getElementById('relaxBtn');
    const themeBtn = document.getElementById('themeBtn');

    const musicBtn = document.getElementById('musicBtn');
    const uiContainer = document.getElementById('ui');
    const controlsBar = document.getElementById('controls-bar');

    const achievementToast = document.getElementById('achievementToast');

    let score = 0;
    let highScore = localStorage.getItem('polarHighScorePro') || 0;
    document.getElementById('highScore').innerText = highScore;

    let level = 1;
    let successfulHits = 0;
    let consecutiveFails = 0;

    let requiredHitsForLevel = 1;
    let maxFailsForPenalty = 3;
    let fxVolume = 0.3;
    let musicVolume = 0.5;
    let curveVarietyMode = 'pretty'; 
    let layerCount = 1; // 1, 2 o 3 capas superpuestas

    let musicMode = 1; 
    let currentTrackIndex = 1;
    const totalTracks = 53;
    let mp3Player = new Audio();
    mp3Player.volume = musicVolume;

    mp3Player.addEventListener('ended', () => {

    });

    function toggleMusic() {
        initAudioContext();
        musicMode = (musicMode + 1) % 3;
        if (musicMode === 0) {
            musicBtn.classList.remove('active');
            musicBtn.innerText = "MÚSICA: OFF";
            mp3Player.pause();
        } else if (musicMode === 1) {
            musicBtn.classList.add('active');
            musicBtn.innerText = "MÚSICA: SECUENCIAL";
            playNextTrack();
        } else {
            musicBtn.classList.add('active');
            musicBtn.innerText = "MÚSICA: ALEATORIO";
            playNextTrack();
        }
    }

    function playNextTrack() {
        if (musicMode === 0) {
            musicMode = 1;
            musicBtn.classList.add('active');
            musicBtn.innerText = "MÚSICA: SECUENCIAL";
        }
        
        if (musicMode === 1) {
            currentTrackIndex++;
            if (currentTrackIndex > totalTracks) currentTrackIndex = 1;
        } else if (musicMode === 2) {
            currentTrackIndex = Math.floor(Math.random() * totalTracks) + 1;
        }

        let trackStr = String(currentTrackIndex).padStart(3, '0');
        mp3Player.src = `multimedia/${trackStr}.mp3`;
        mp3Player.play().catch(e => console.log("Reproducción pendiente de interacción", e));
    }

    function nextSongAndForm() {
        initAudioContext();
        playNextTrack();
        generateNewForm();
        if (isRandomThemeMode) applyRandomTheme();
        resetTarget();
    }

    let autoMode = false;
    let isPaused = false;
    let relaxMode = false;
    let gameMode = 'arcade';
    let timeAttackSeconds = 60;
    let timeAttackTimer = null;
    let gameSpeed = 1.0;
    let angle = 0;
    
    let curveType = 'rhodonea';
    let p1 = 4, p2 = 5, p3 = 2;
    let currentScale = 150;
    let relaxTimer = 0;
    let screenShake = 0;

    let floatingTexts = [];

    let achievements = [
        { id: 'first_perfect', name: 'Primer Impacto', desc: 'Consigue tu primer acierto', unlocked: false },
        { id: 'streak_3', name: 'Racha de Bronce', desc: 'Consigue 3 aciertos seguidos', unlocked: false },
        { id: 'streak_7', name: 'Racha de Plata', desc: 'Consigue 7 aciertos seguidos', unlocked: false },
        { id: 'streak_15', name: 'Racha de Oro', desc: 'Consigue 15 aciertos seguidos', unlocked: false },
        { id: 'level_10', name: 'Explorador Polar', desc: 'Alcanza el nivel 10', unlocked: false },
        { id: 'level_25', name: 'Maestro Polar', desc: 'Alcanza el nivel 25', unlocked: false },
        { id: 'level_50', name: 'Leyenda Viva', desc: 'Alcanza el nivel 50', unlocked: false },
        { id: 'score_1000', name: 'Fiebre Neón', desc: 'Supera los 1.000 puntos', unlocked: false },
        { id: 'score_5000', name: 'Dios del Neón', desc: 'Supera los 5.000 puntos', unlocked: false },
        { id: 'score_10000', name: 'Infinito', desc: 'Supera los 10.000 puntos', unlocked: false },
        { id: 'speed_demon', name: 'Velocidad Luz', desc: 'Juega a velocidad 3.0x', unlocked: false },
        { id: 'zen_mode', name: 'Modo Zen', desc: 'Activa el modo Relax', unlocked: false },
        { id: 'auto_pilot', name: 'Piloto', desc: 'Activa el modo Auto', unlocked: false },
        { id: 'palette_master', name: 'Coleccionista', desc: 'Explora 10 paletas distintas', unlocked: false },
        { id: 'survivor', name: 'Resiliencia', desc: 'Sobrevive a una penalización', unlocked: false }
    ];

    const themes = [
        { name: 'Cyber', bg: '#080c16', stroke: '#ff007f', target: '#00ffcc', wave: 'rgba(0, 255, 204, 0.85)', glow: 'rgba(255, 0, 127, 0.3)' },
        { name: 'Matrix', bg: '#020f04', stroke: '#00ff55', target: '#adff2f', wave: 'rgba(173, 255, 47, 0.85)', glow: 'rgba(0, 255, 85, 0.3)' },
        { name: 'Laser', bg: '#0e0214', stroke: '#bf00ff', target: '#00ffff', wave: 'rgba(0, 255, 255, 0.85)', glow: 'rgba(191, 0, 255, 0.3)' },
        { name: 'Retro 8b', bg: '#021008', stroke: '#33ff33', target: '#ffff33', wave: 'rgba(255, 255, 51, 0.85)', glow: 'rgba(51, 255, 51, 0.3)' },
        { name: 'Sunset', bg: '#14050a', stroke: '#ff3366', target: '#ffcc00', wave: 'rgba(255, 204, 0, 0.85)', glow: 'rgba(255, 51, 102, 0.3)' },
        { name: 'Acid', bg: '#0f1402', stroke: '#ccff00', target: '#ff00ff', wave: 'rgba(255, 0, 255, 0.85)', glow: 'rgba(204, 255, 0, 0.3)' },
        { name: 'Gold', bg: '#120c02', stroke: '#ffaa00', target: '#ffffff', wave: 'rgba(255, 255, 255, 0.85)', glow: 'rgba(255, 170, 0, 0.3)' },
        { name: 'Frost', bg: '#020a14', stroke: '#00ccff', target: '#ffffff', wave: 'rgba(0, 204, 255, 0.85)', glow: 'rgba(0, 204, 255, 0.3)' },
        { name: 'Blood', bg: '#140202', stroke: '#ff0000', target: '#ff9999', wave: 'rgba(255, 153, 153, 0.85)', glow: 'rgba(255, 0, 0, 0.3)' },
        { name: 'Neon Vio', bg: '#0a0212', stroke: '#9900ff', target: '#00ffaa', wave: 'rgba(0, 255, 170, 0.85)', glow: 'rgba(153, 0, 255, 0.3)' }
    ];
    let currentThemeIndex = 0;
    let theme = themes[0];
    let isRandomThemeMode = true;
        let pulseRadius = 0;
    let feedbackTimer = 0;
    let feedbackText = '';
    let feedbackColor = '#00ffcc';
    let screenFlash = 0;
    let particles = [];
    let targetParticles = [];

    let target = {
        angle: Math.random() * Math.PI * 2,
        radius: 140,
        speed: 0.005
    };

    function resetAchievements() {
        achievements.forEach(a => a.unlocked = false);
        achievementToast.innerText = "¡Logros Reseteados!";
        achievementToast.classList.add('show');
        setTimeout(() => achievementToast.classList.remove('show'), 3000);
        if(document.getElementById('achievementsModal').style.display === 'block') {
            openAchievements();
        }
    }

    function unlockAchievement(id) {
        let ach = achievements.find(a => a.id === id);
        if (ach && !ach.unlocked) {
            ach.unlocked = true;
            achievementToast.innerText = `🏆 ¡Logro: ${ach.name}!`;
            achievementToast.classList.add('show');
            setTimeout(() => achievementToast.classList.remove('show'), 3500);
        }
    }

    function openAchievements() {
        let listEl = document.getElementById('achievementsList');
        listEl.innerHTML = '';
        achievements.forEach(a => {
            listEl.innerHTML += `<div style="margin:6px 0; color:${a.unlocked ? '#00ffcc' : '#666'}; border-bottom: 1px solid #111; padding-bottom: 4px;"><b>${a.name}</b> (${a.unlocked ? '✔' : '🔒'})<br><span style="font-size:0.6rem; color:#aaa;">${a.desc}</span></div>`;
        });
        toggleModal('achievementsModal');
    }

    function toggleModal(id) {
        let m = document.getElementById(id);
        m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    function resetTarget() {
        target.angle = Math.random() * Math.PI * 2;
        target.radius = 55 + Math.random() * (currentScale - 45);
        target.speed = (Math.random() > 0.5 ? 1 : -1) * (0.003 + (level * 0.0007));
        pulseRadius = 0;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudioContext() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function generateNewForm() {
        const prettyCurves = [
            'rhodonea', 'roseFrac', 'piWave', 'grandisRose', 'trifolio', 'cuatrifolio',
            'cardioidLim', 'lemniscate', 'epicycloid', 'star', 'flower', 'octagram', 'decagram'
        ];
        
        const allCurves = [
            ...prettyCurves,
            'harmonic', 'lissajous', 'butterfly', 'spirograph', 'gear',
            'epitrochoid', 'hypotrochoid', 'cazoleta', 'logSpiral', 'cornu',
            'astroide', 'deltoide', 'hypocycloid', 'polyRose', 'nephroid',
            'limacon', 'parabolicHelix', 'superEllipse', 'sinusoidalGrid',
            'toroidalWave', 'hyperbolicSpiral', 'omegaSpiral'
        ];

        let valid = false;
        let attempts = 0;

        while (!valid && attempts < 30) {
            attempts++;
            const pool = (curveVarietyMode === 'pretty') ? prettyCurves : allCurves;
            curveType = pool[Math.floor(Math.random() * pool.length)];
            
            p1 = Math.floor(Math.random() * 6) + 2;
            p2 = Math.floor(Math.random() * 5) + 2;
            p3 = Math.floor(Math.random() * 3) + 1;

            if (autoNormalizeCurve()) {
                valid = true;
            }
        }
    }

    function autoNormalizeCurve() {
        let maxVal = 0;
        let testSteps = 120;
        
        for (let i = 0; i < testSteps; i++) {
            let th = (i / testSteps) * Math.PI * 16;
            let rawR = Math.abs(getRawPolarRadius(th, 0));
            if (!isNaN(rawR) && rawR < 1000) {
                if (rawR > maxVal) maxVal = rawR;
            }
        }
        
        // Evitar figuras diminutas
        if (maxVal < 35 || isNaN(maxVal)) {
            return false;
        }

        let targetRadius = 145;
        currentScale = targetRadius / (maxVal / 100 + 0.05);
        if (currentScale < 70) currentScale = 70;
        if (currentScale > 180) currentScale = 180;

        return true;
    }

    function getRawPolarRadius(th, currentAngle) {
        let t = th + currentAngle;
        switch(curveType) {
            case 'rhodonea': return Math.cos((p1 * t) / p2) * 100;
            case 'roseFrac': return Math.sin((p1 * t) / p2) * 100;
            case 'piWave': return Math.sin(p1 * Math.PI * t / p2) * 105;
            case 'grandisRose': return (Math.sin(p1 * t / 3) * Math.cos(p2 * t / 2)) * 100;
            case 'trifolio': return Math.sin(3 * t) * 100;
            case 'cuatrifolio': return Math.cos(2 * t) * 100;
            case 'cardioidLim': return (1 + 0.6 * Math.cos(p1 * t)) * 95;
            case 'lemniscate': return Math.sqrt(Math.abs(Math.cos(p1 * t))) * 110;
            case 'epicycloid': return (Math.sin(p1 * t) * Math.cos(p2 * th)) * 100;
            case 'star': return (1 - 0.35 * Math.abs(Math.sin(p1 * t / 2))) * 105;
            case 'flower': return (0.5 + 0.5 * Math.cos(p1 * t)) * 110;
            case 'octagram': return Math.cos(4 * t) * 105;
            case 'decagram': return Math.cos(5 * t) * 105;
            case 'harmonic': return (Math.sin(p1 * t) + Math.cos(p2 * th) / p3) * 90;
            case 'lissajous': return Math.sin(p1 * t + Math.PI/p3) * Math.cos(p2 * t) * 100;
            case 'butterfly': return (Math.exp(Math.cos(t)) - 2 * Math.cos(4*t)) * 45;
            case 'spirograph': return (0.8 * Math.cos(p1 * t) + 0.3 * Math.cos(p2 * t)) * 100;
            case 'gear': return (1 + 0.2 * Math.sin(p1 * p2 * t)) * 95;
            case 'epitrochoid': return (1.2 * Math.cos(p1 * t) - 0.4 * Math.cos(p2 * t)) * 90;
            case 'hypotrochoid': return (0.9 * Math.sin(p1 * t) + 0.3 * Math.sin(p3 * t)) * 95;
            case 'cazoleta': return (Math.sin(p1 * t) * Math.sin(p2 * t)) * 100;
            case 'logSpiral': return Math.exp(0.08 * Math.sin(t)) * 85;
            case 'cornu': return Math.sin(t * t * 0.08) * 95;
            case 'astroide': return Math.pow(Math.abs(Math.cos(t)), 3) * 105;
            case 'deltoide': return (2 * Math.cos(t) + Math.cos(2 * t)) * 65;
            case 'hypocycloid': return ((p1-1)*Math.cos(t) + Math.cos((p1-1)*t)) * 55;
            case 'polyRose': return (Math.sin(p1 * t) * Math.sin(p2 * t)) * 100;
            case 'nephroid': return (1 + 2 * Math.sin(t/2)) * 70;
            case 'limacon': return (0.5 + Math.cos(t)) * 95;
            case 'parabolicHelix': return Math.tan(t * 0.1) * 40;
            case 'superEllipse': return Math.pow(Math.abs(Math.cos(t)), 2/p1) * 95;
            case 'sinusoidalGrid': return (Math.sin(p1*t) + Math.sin(p2*t)) * 90;
            case 'toroidalWave': return (Math.cos(p1*t) * Math.sin(p2*t)) * 95;
            case 'hyperbolicSpiral': return (65 / (t + 0.5));
            case 'omegaSpiral': return (Math.sin(t) * Math.cos(t * 0.5)) * 95;
            default: return Math.sin(p1 * t) * 100;
        }
    }

    function calculatePolarRadius(th, currentAngle, scaleMultiplier = 1.0) {
        let raw = getRawPolarRadius(th, currentAngle);
        return currentScale * scaleMultiplier * (raw / 100);
    }
        function createExplosionParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            let pAngle = Math.random() * Math.PI * 2;
            let pSpeed = Math.random() * 3 + 1;
            particles.push({ x: x, y: y, vx: Math.cos(pAngle) * pSpeed, vy: Math.sin(pAngle) * pSpeed, life: 1.0, color: theme.target });
        }
    }

    function toggleAutoMode() {
        initAudioContext();
        autoMode = !autoMode;
        autoBtn.classList.toggle('active', autoMode);
        autoBtn.innerText = autoMode ? "AUTO: ON" : "AUTO: OFF";
        if (autoMode) unlockAchievement('auto_pilot');
    }

    function togglePause() {
        initAudioContext();
        isPaused = !isPaused;
        pauseBtn.classList.toggle('active', isPaused);
        pauseBtn.innerText = isPaused ? "REANUDAR" : "PAUSA";
    }

    function updateSettings() {
        curveVarietyMode = document.getElementById('curveVarietySelect').value;
        layerCount = parseInt(document.getElementById('layerCountSelect').value) || 1;
        requiredHitsForLevel = parseInt(document.getElementById('hitsPerLevelInput').value) || 1;
        maxFailsForPenalty = parseInt(document.getElementById('failsPerPenaltyInput').value) || 3;
        fxVolume = parseFloat(document.getElementById('fxVolInput').value);
        musicVolume = parseFloat(document.getElementById('musicVolInput').value);
        mp3Player.volume = musicVolume;
    }

    function toggleGameMode() {
        if (gameMode === 'arcade') {
            gameMode = 'infinite';
            modeBtn.innerText = "MODO: INFINITO";
        } else if (gameMode === 'infinite') {
            gameMode = 'timeAttack';
            modeBtn.innerText = "MODO: CONTRARELOJ";
            startTimeAttack();
        } else if (gameMode === 'timeAttack') {
            gameMode = 'ghost';
            modeBtn.innerText = "MODO: FANTASMA";
            if (timeAttackTimer) clearInterval(timeAttackTimer);
        } else {
            gameMode = 'arcade';
            modeBtn.innerText = "MODO: ARCADE";
        }
        modeBtn.classList.add('active');
        consecutiveFails = 0;
        successfulHits = 0;
        perfectStreak = 0;
        updateDOMStats();
    }

    function startTimeAttack() {
        timeAttackSeconds = 60;
        if (timeAttackTimer) clearInterval(timeAttackTimer);
        timeAttackTimer = setInterval(() => {
            if (!isPaused && !relaxMode && gameMode === 'timeAttack') {
                timeAttackSeconds--;
                updateDOMStats();
                if (timeAttackSeconds <= 0) {
                    clearInterval(timeAttackTimer);
                    alert("¡Tiempo agotado! Puntuación final: " + score);
                    resetGame();
                }
            }
        }, 1000);
    }

    function updateDOMStats() {
        if (gameMode === 'infinite') {
            modeLabel.innerText = "Infinito";
            statsRow.innerHTML = `Nivel: <span id="level">${level}</span> | Racha: ${perfectStreak}`;
        } else if (gameMode === 'timeAttack') {
            modeLabel.innerText = "Contrarreloj";
            statsRow.innerHTML = `T: ${timeAttackSeconds}s | Ptos: ${score} | Lvl: <span id="level">${level}</span>`;
        } else if (gameMode === 'ghost') {
            modeLabel.innerText = "Fantasma";
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Lvl: <span id="level">${level}</span>`;
        } else {
            modeLabel.innerText = "Arcade";
            statsRow.innerHTML = `Ptos: <span id="score">${score}</span> | Récord: <span id="highScore">${highScore}</span> | Lvl: <span id="level">${level}</span>`;
        }
    }

    function applyRandomTheme() {
        let rnd = Math.floor(Math.random() * themes.length);
        theme = themes[rnd];
        mainTitle.style.color = theme.stroke;
        canvas.style.boxShadow = `0 0 30px ${theme.glow}`;
    }

    function changeTheme() {
        isRandomThemeMode = false;
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        theme = themes[currentThemeIndex];
        themeLabel.innerText = theme.name;
        themeBtn.innerText = `PALETA: ${currentThemeIndex + 1}/10`;
        mainTitle.style.color = theme.stroke;
        canvas.style.boxShadow = `0 0 30px ${theme.glow}`;
        
        themesExplored++;
        if (themesExplored >= 10) unlockAchievement('palette_master');
    }

    function changeSpeed() {
        if (gameSpeed === 1.0) gameSpeed = 1.5;
        else if (gameSpeed === 1.5) gameSpeed = 2.0;
        else if (gameSpeed === 2.0) { gameSpeed = 3.0; unlockAchievement('speed_demon'); }
        else if (gameSpeed === 3.0) gameSpeed = 0.25;
        else if (gameSpeed === 0.25) gameSpeed = 0.5;
        else gameSpeed = 1.0;
        speedBtn.innerText = 'VEL: ' + gameSpeed.toFixed(2).replace(/\.?0+$/, '') + 'x';
    }

    function resetGame() {
        score = 0;
        level = 1;
        consecutiveFails = 0;
        successfulHits = 0;
        perfectStreak = 0;
        pulseRadius = 0;
        floatingTexts = [];

        if (gameMode === 'timeAttack') startTimeAttack();
        generateNewForm();
        resetTarget();
        updateDOMStats();
    }

    function toggleRelaxMode() {
        initAudioContext();
        relaxMode = !relaxMode;
        relaxBtn.classList.toggle('active', relaxMode);
        if (relaxMode) {
            unlockAchievement('zen_mode');
            uiContainer.style.opacity = '0';
            uiContainer.style.pointerEvents = 'none';
            controlsBar.style.opacity = '0';
            controlsBar.style.pointerEvents = 'none';
            floatingControls.style.display = 'flex';
        } else {
            uiContainer.style.opacity = '1';
            uiContainer.style.pointerEvents = 'auto';
            controlsBar.style.opacity = '1';
            controlsBar.style.pointerEvents = 'auto';
            floatingControls.style.display = 'none';
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (!autoMode && !isPaused && !relaxMode) checkAction();
    }, false);

    function checkAction() {
        if (isPaused || relaxMode) return;
        initAudioContext();
        
        if(audioCtx && audioCtx.state === 'running') {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);

        let diff = Math.abs(pulseRadius - target.radius);
        let tolerance = 25;

        if (diff < tolerance) {
            consecutiveFails = 0;
            successfulHits++;
            perfectStreak++;
            
            unlockAchievement('first_perfect');
            if (perfectStreak >= 3) unlockAchievement('streak_3');
            if (perfectStreak >= 7) unlockAchievement('streak_7');
            if (perfectStreak >= 15) unlockAchievement('streak_15');

            if (perfectStreak > 1) {
                floatingTexts.push({ x: cx, y: cy - 30, text: `COMBO x${perfectStreak}!`, life: 1.0, color: theme.stroke });
            }

            if (gameMode !== 'infinite') {
                let ghostBonus = (gameMode === 'ghost') ? 50 : 0;
                score += 100 + ghostBonus + (level * (gameMode === 'timeAttack' ? 25 : 10)) + (perfectStreak * 10);
                if (gameMode === 'timeAttack') timeAttackSeconds += 3;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('polarHighScorePro', highScore);
                    if (highScore >= 1000) unlockAchievement('score_1000');
                    if (highScore >= 5000) unlockAchievement('score_5000');
                    if (highScore >= 10000) unlockAchievement('score_10000');
                }
            }

            feedbackText = "¡PERFECTO!";
            feedbackColor = theme.stroke;
            screenFlash = 0.4;
            createExplosionParticles(tx, ty);

            if (successfulHits >= requiredHitsForLevel) {
                level++;
                successfulHits = 0;
                if (isRandomThemeMode) applyRandomTheme();
                if (level >= 10) unlockAchievement('level_10');
                if (level >= 25) unlockAchievement('level_25');
                if (level >= 50) unlockAchievement('level_50');
            }

            generateNewForm();
            resetTarget();
        } else {
            consecutiveFails++;
            perfectStreak = 0;
            screenShake = 10;

            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                successfulHits = 0;
                if (gameMode === 'infinite' || gameMode === 'arcade' || gameMode === 'ghost') {
                    if (level > 1) unlockAchievement('survivor');
                    level = Math.max(1, level - 1);
                    feedbackText = "¡BAJAS NIVEL!";
                } else {
                    score = 0;
                    feedbackText = "¡PUNTOS A CERO!";
                }
            } else {
                if (gameMode !== 'infinite') score = Math.max(0, score - 15);
                feedbackText = "¡FALLO!";
            }
            feedbackColor = "#ff0055";
        }
        
        updateDOMStats();
        feedbackTimer = 35;
    }

    function update() {
        if (isPaused) return;
        if (screenShake > 0) screenShake *= 0.85;

        if (relaxMode) {
            relaxTimer++;
            if (relaxTimer > 250) {
                relaxTimer = 0;
                generateNewForm();
                if(isRandomThemeMode) applyRandomTheme();
            }
        }

        target.angle += target.speed * gameSpeed;

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        let isGhostInvisible = (gameMode === 'ghost' && pulseRadius > 80);
        
        if (!isGhostInvisible) {
            targetParticles.push({ x: tx, y: ty, life: 1.0 });
        }

        for (let i = targetParticles.length - 1; i >= 0; i--) {
            targetParticles[i].life -= 0.1;
            if (targetParticles[i].life <= 0) targetParticles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].y -= 0.8;
            floatingTexts[i].life -= 0.02;
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }

        pulseRadius += (1.2 + (level * 0.05)) * gameSpeed;

        if (pulseRadius > 230) {
            consecutiveFails++;
            perfectStreak = 0;
            if (consecutiveFails >= maxFailsForPenalty) {
                consecutiveFails = 0;
                if (level > 1) unlockAchievement('survivor');
                if (gameMode === 'infinite') level = Math.max(1, level - 1);
                else score = 0;
                updateDOMStats();
            }
            resetTarget();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.04;
            if (p.life <= 0) particles.splice(i, 1);
        }

        angle += 0.003 * gameSpeed;
        if (autoMode && Math.abs(pulseRadius - target.radius) < 2) checkAction();
    }

    function draw() {
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        ctx.fillStyle = theme.bg;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;

        if (screenFlash > 0) {
            ctx.fillStyle = theme.stroke;
            ctx.globalAlpha = screenFlash;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            screenFlash -= 0.05;
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Renderizado de capas superpuestas (1, 2 o 3 funciones a diferentes radios y rotaciones)
        let scales = [1.0, 0.75, 0.5];
        let opacities = [1.0, 0.65, 0.4];
        let rotations = [angle, -angle * 1.5, angle * 0.5 + Math.PI / 4];

        for (let l = 0; l < layerCount; l++) {
            ctx.beginPath();
            ctx.strokeStyle = theme.stroke;
            ctx.lineWidth = (l === 0) ? 2.5 : 1.8;
            ctx.shadowColor = theme.stroke;
            ctx.shadowBlur = (l === 0) ? 10 : 5;
            ctx.globalAlpha = opacities[l];
            
            let maxTheta = Math.PI * 16;
            for (let th = 0; th < maxTheta; th += 0.01) {
                let r = calculatePolarRadius(th, rotations[l], scales[l]);
                let x = cx + r * Math.cos(th);
                let y = cy + r * Math.sin(th);
                if (th === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;

        for (let tp of targetParticles) {
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.globalAlpha = tp.life * 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        let isGhostInvisible = (gameMode === 'ghost' && pulseRadius > 80);
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        if (!relaxMode && !isGhostInvisible) {
            ctx.beginPath();
            ctx.arc(tx, ty, 8, 0, Math.PI * 2);
            ctx.fillStyle = theme.target;
            ctx.shadowColor = theme.target;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = theme.wave;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        for (let ft of floatingTexts) {
            ctx.font = 'bold 15px monospace';
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = ft.life;
            ctx.textAlign = 'center';
            ctx.shadowColor = ft.color;
            ctx.shadowBlur = 10;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        if (isPaused) {
            ctx.font = 'bold 22px monospace';
            ctx.fillStyle = theme.target;
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (!relaxMode && feedbackTimer > 0) {
            ctx.font = 'bold 18px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy + 40);
            feedbackTimer--;
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    applyRandomTheme();
    generateNewForm();
    resetTarget();
    loop();
    
    window.addEventListener('pointerdown', () => {
        if (musicMode > 0 && mp3Player.paused) {
            playNextTrack();
        }
    }, { once: true });
</script>
</body>
</html>
