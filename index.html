<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polar Infinity - Deep Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            background-color: #05070d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.5s ease;
        }
        #ui {
            margin-top: 8px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1rem; letter-spacing: 2px; color: #ff007f; transition: color 0.5s ease; }
        p { margin: 2px 0 0 0; font-size: 0.7rem; color: #8ab4f8; }
        
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }
        
        canvas {
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
            background: #080c16;
            border-radius: 50%;
            width: 82vw;
            height: 82vw;
            max-width: 380px;
            max-height: 380px;
            transition: width 0.3s ease, height 0.3s ease, box-shadow 0.5s ease;
        }

        #controls-bar {
            margin-bottom: 12px;
            display: flex;
            gap: 5px;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: rgba(0, 255, 204, 0.15);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 8px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.58rem;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
        }

        .btn.active {
            background: #ff007f;
            border-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 10px #ff007f;
        }

        #instructions {
            margin-bottom: 6px;
            font-size: 0.55rem;
            color: #5f6368;
            text-align: center;
            padding: 0 10px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1 id="mainTitle">POLAR INFINITY DEEP</h1>
        <p>Ptos: <span id="score">0</span> | Récord: <span id="highScore">0</span> | Nivel: <span id="level">1</span></p>
        <p style="font-size: 0.65rem; color: #ff00aa;">Modo: <span id="modeLabel">Normal</span> | Tema: <span id="themeLabel">Cyber</span></p>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div id="controls-bar">
        <button id="pauseBtn" class="btn" onclick="togglePause()">PAUSA</button>
        <button id="modeBtn" class="btn" onclick="toggleMode()">MODO: ARCADE</button>
        <button id="themeBtn" class="btn" onclick="changeTheme()">TEMA: CYBER</button>
        <button id="zoomBtn" class="btn" onclick="changeZoom()">ZOOM: MED</button>
        <button id="speedBtn" class="btn" onclick="changeSpeed()">VEL: 1.0x</button>
        <button id="autoBtn" class="btn" onclick="toggleAutoMode()">AUTO: OFF</button>
    </div>
    
    <div id="instructions">Toca la pantalla cuando el anillo coincida con el punto brillante</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const levelEl = document.getElementById('level');
    const modeLabel = document.getElementById('modeLabel');
    const themeLabel = document.getElementById('themeLabel');
    const mainTitle = document.getElementById('mainTitle');
    const autoBtn = document.getElementById('autoBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const zoomBtn = document.getElementById('zoomBtn');
    const modeBtn = document.getElementById('modeBtn');
    const themeBtn = document.getElementById('themeBtn');

    let score = 0;
    let highScore = localStorage.getItem('polarHighScore') || 0;
    highScoreEl.innerText = highScore;

    let level = 1;
    let fails = 0;
    let autoMode = false;
    let isPaused = false;
    let hardcoreMode = false; // Modo Supervivencia (1 vida)
    let gameSpeed = 1.0;
    let zoomLevel = 1;
    let angle = 0;
    
    let num = 4;
    let den = 5;
    let curveType = 'fraction';
    let currentScale = 90;

    // Temas visuales avanzados
    let currentThemeIndex = 0;
    const themes = [
        { name: 'Cyber', bg: '#080c16', stroke: '#ff007f', target: '#00ffcc', wave: 'rgba(0, 255, 204, 0.7)', glow: 'rgba(255, 0, 127, 0.3)' },
        { name: 'Matrix', bg: '#020f04', stroke: '#00ff55', target: '#adff2f', wave: 'rgba(173, 255, 47, 0.7)', glow: 'rgba(0, 255, 85, 0.3)' },
        { name: 'Laser', bg: '#0e0214', stroke: '#bf00ff', target: '#00ffff', wave: 'rgba(0, 255, 255, 0.7)', glow: 'rgba(191, 0, 255, 0.3)' },
        { name: 'Retro 8b', bg: '#021008', stroke: '#33ff33', target: '#ffff33', wave: 'rgba(255, 255, 51, 0.7)', glow: 'rgba(51, 255, 51, 0.3)' }
    ];
    let theme = themes[0];

    let pulseRadius = 0;
    let feedbackTimer = 0;
    let feedbackText = '';
    let feedbackColor = '#00ffcc';
    let screenFlash = 0; // Efecto de destello al acertar

    // Sistema de partículas estelares polares
    let particles = [];

    let target = {
        angle: Math.random() * Math.PI * 2,
        radius: 110,
        speed: 0.005
    };

    function resetTarget() {
        target.angle = Math.random() * Math.PI * 2;
        target.radius = 45 + Math.random() * (currentScale - 20);
        target.speed = (Math.random() > 0.5 ? 1 : -1) * (0.004 + level * 0.001);
        pulseRadius = 0;
    }

    // --- AUDIO Y MÚSICA ESPACIAL PROCEDURAL ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let musicInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
            startProceduralMusic();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSynthTone(freq, type = 'sine', duration = 0.3) {
        try {
            if (!audioCtx || isPaused) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    const backgroundScale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63];
    function startProceduralMusic() {
        if (musicInterval) return;
        musicInterval = setInterval(() => {
            if (!audioCtx || audioCtx.state !== 'running' || isPaused) return;
            // Frecuencias sutilmente moduladas por el ángulo orbital del objetivo
            let modFreq = backgroundScale[Math.floor(Math.random() * backgroundScale.length)] * (1 + Math.sin(target.angle) * 0.1);
            playSynthTone(modFreq, 'sine', 2.2);
            setTimeout(() => playSynthTone(modFreq * 1.5, 'triangle', 1.5), 1000);
        }, 3500);
    }

    // Frecuencias dinámicas basadas en el ángulo del punto objetivo
    function getDynamicNote() {
        const baseNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 659.25, 783.99];
        let index = Math.floor(Math.abs(Math.sin(target.angle)) * baseNotes.length);
        return baseNotes[index % baseNotes.length];
    }
    // -----------------------------------------------------------------

    function generateNewForm() {
        const types = ['fraction', 'pi', 'multi', 'rose'];
        curveType = types[Math.floor(Math.random() * types.length)];

        if (curveType === 'fraction') {
            num = Math.floor(Math.random() * 6) + 1;
            den = Math.floor(Math.random() * 5) + 2;
        } else if (curveType === 'pi') {
            num = (Math.random() * 2 + 0.8).toFixed(1);
        } else if (curveType === 'multi') {
            num = Math.floor(Math.random() * 5) + 2;
            den = Math.floor(Math.random() * 3) + 1;
        } else {
            num = Math.floor(Math.random() * 7) + 2;
        }

        currentScale = Math.floor(Math.random() * 130) + 60;
    }

    function createExplosionParticles(x, y) {
        for (let i = 0; i < 18; i++) {
            let pAngle = Math.random() * Math.PI * 2;
            let pSpeed = Math.random() * 3.5 + 1;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(pAngle) * pSpeed,
                vy: Math.sin(pAngle) * pSpeed,
                life: 1.0,
                color: theme.target
            });
        }
    }

    function toggleAutoMode() {
        initAudio();
        autoMode = !autoMode;
        autoBtn.classList.toggle('active', autoMode);
        autoBtn.innerText = autoMode ? "AUTO: ON" : "AUTO: OFF";
    }

    function togglePause() {
        initAudio();
        isPaused = !isPaused;
        pauseBtn.classList.toggle('active', isPaused);
        pauseBtn.innerText = isPaused ? "REANUDAR" : "PAUSA";
    }

    function toggleMode() {
        hardcoreMode = !hardcoreMode;
        modeBtn.classList.toggle('active', hardcoreMode);
        modeLabel.innerText = hardcoreMode ? "EXTREMO (1 Vvida)" : "Arcade";
    }

    function changeTheme() {
        currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        theme = themes[currentThemeIndex];
        themeLabel.innerText = theme.name;
        themeBtn.innerText = 'TEMA: ' + theme.name;
        mainTitle.style.color = theme.stroke;
        canvas.style.boxShadow = `0 0 35px ${theme.glow}`;
    }

    function changeSpeed() {
        if (gameSpeed === 1.0) gameSpeed = 1.5;
        else if (gameSpeed === 1.5) gameSpeed = 2.0;
        else if (gameSpeed === 2.0) gameSpeed = 0.5;
        else gameSpeed = 1.0;

        speedBtn.innerText = 'VEL: ' + gameSpeed.toFixed(1) + 'x';
    }

    function changeZoom() {
        zoomLevel = (zoomLevel + 1) % 3;
        if (zoomLevel === 0) {
            canvas.style.width = '68vw'; canvas.style.height = '68vw';
            canvas.style.maxWidth = '310px'; canvas.style.maxHeight = '310px';
            zoomBtn.innerText = 'ZOOM: MIN';
        } else if (zoomLevel === 1) {
            canvas.style.width = '82vw'; canvas.style.height = '82vw';
            canvas.style.maxWidth = '380px'; canvas.style.maxHeight = '380px';
            zoomBtn.innerText = 'ZOOM: MED';
        } else {
            canvas.style.width = '94vw'; canvas.style.height = '94vw';
            canvas.style.maxWidth = '450px'; canvas.style.maxHeight = '450px';
            zoomBtn.innerText = 'ZOOM: MAX';
        }
    }

    function triggerGameOver() {
        playSynthTone(90, 'sawtooth', 0.6);
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('polarHighScore', highScore);
            highScoreEl.innerText = highScore;
        }
        score = 0;
        level = 1;
        fails = 0;
        scoreEl.innerText = score;
        levelEl.innerText = level;
        feedbackText = "¡GAME OVER!";
        feedbackColor = "#ff0000";
        feedbackTimer = 40;
    }

    function checkAction() {
        if (isPaused) return;
        initAudio();
        playSynthTone(getDynamicNote(), 'triangle', 0.2);

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);

        let diff = Math.abs(pulseRadius - target.radius);
        let tolerance = Math.max(14, 30 - level * 1.5);

        if (diff < tolerance) {
            score += Math.round(100 * level * gameSpeed);
            fails = 0;
            feedbackText = "¡PERFECTO!";
            feedbackColor = theme.stroke;
            screenFlash = 0.4; // Destello de pantalla
            createExplosionParticles(tx, ty);
            playSynthTone(783.99, 'sine', 0.4); 

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('polarHighScore', highScore);
                highScoreEl.innerText = highScore;
            }

            if (score >= level * 400) {
                level++;
                levelEl.innerText = level;
            }

            generateNewForm();
            resetTarget();
        } else {
            if (hardcoreMode) {
                triggerGameOver();
                return;
            }
            fails++;
            if (fails >= 4 && level > 1) {
                level--;
                levelEl.innerText = level;
                fails = 0;
            }
            score = Math.max(0, score - 20);
            feedbackText = "¡FALLO!";
            feedbackColor = "#ff0055";
            playSynthTone(130.81, 'sawtooth', 0.2);
        }
        feedbackTimer = 25;
        scoreEl.innerText = score;
    }

    function updateAutoMode() {
        if (!autoMode || isPaused) return;
        if (Math.abs(pulseRadius - target.radius) < 2) {
            checkAction();
        }
    }

    window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        if (!autoMode && !isPaused) checkAction();
    }, false);

    function update() {
        if (isPaused) return;

        target.angle += target.speed * gameSpeed;

        let pulseSpeed = (1.4 + (level - 1) * 0.3) * gameSpeed;
        pulseRadius += pulseSpeed;

        if (pulseRadius > 230) {
            if (hardcoreMode) {
                triggerGameOver();
                resetTarget();
                return;
            }
            if (!autoMode) {
                fails++;
                if (fails >= 4 && level > 1) {
                    level--;
                    levelEl.innerText = level;
                    fails = 0;
                }
            }
            resetTarget();
        }

        // Actualizar partículas estelares
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03;
            if (p.life <= 0) particles.splice(i, 1);
        }

        angle += 0.004 * gameSpeed;
        updateAutoMode();
    }

    function draw() {
        // Fondo con estela de movimiento y destello de impacto
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (screenFlash > 0) {
            ctx.fillStyle = theme.stroke;
            ctx.globalAlpha = screenFlash;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            screenFlash -= 0.05;
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let r = 50; r <= 200; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Trazado de la figura polar geométrica
        ctx.beginPath();
        ctx.strokeStyle = theme.stroke;
        ctx.lineWidth = 2.4;
        ctx.shadowColor = theme.stroke;
        ctx.shadowBlur = 12;
        
        let maxTheta = Math.PI * 20; 
        
        for (let th = 0; th < maxTheta; th += 0.005) {
            let r = 0;
            if (curveType === 'fraction') {
                r = currentScale * Math.sin((num * (th + angle)) / den);
            } else if (curveType === 'pi') {
                r = currentScale * Math.sin(num * (th + angle));
            } else if (curveType === 'multi') {
                r = currentScale * (Math.sin(num * (th + angle)) + Math.cos(den * th));
            } else {
                r = currentScale * Math.cos(num * (th + angle));
            }

            let x = cx + r * Math.cos(th);
            let y = cy + r * Math.sin(th);
            if (th === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Dibujar el punto objetivo dinámico
        let tx = cx + target.radius * Math.cos(target.angle);
        let ty = cy + target.radius * Math.sin(target.angle);
        
        ctx.beginPath();
        ctx.arc(tx, ty, 9, 0, Math.PI * 2);
        ctx.fillStyle = theme.target;
        ctx.shadowColor = theme.target;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Renderizar partículas de explosión estelar
        for (let p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        // Onda expansiva principal
        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = theme.wave;
        ctx.lineWidth = 2;
        ctx.stroke();

        if (isPaused) {
            ctx.font = 'bold 26px monospace';
            ctx.fillStyle = theme.target;
            ctx.textAlign = 'center';
            ctx.fillText("JUEGO EN PAUSA", cx, cy);
        } else if (feedbackTimer > 0) {
            ctx.font = 'bold 20px monospace';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, cx, cy - 40);
            feedbackTimer--;
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    generateNewForm();
    resetTarget();
    loop();
</script>

</body>
</html>
